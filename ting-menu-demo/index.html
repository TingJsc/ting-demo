<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ting Menu - Game Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{
  screens:{qhd:"2560px",uhd:"3840px"},
  fontFamily:{sans:["Segoe UI","Arial","sans-serif"]},
  keyframes:{
    tick:{from:{transform:"translateX(60vw)"},to:{transform:"translateX(-100%)"}},
    spin:{to:{transform:"rotate(360deg)"}},
    fl:{"0%,100%":{opacity:1},"50%":{opacity:.35}},
    pd:{"0%,100%":{transform:"scale(1)"},"50%":{transform:"scale(1.4)",opacity:.7}}
  },
  animation:{tick:"tick 32s linear infinite",spinSlow:"spin 1.5s linear infinite",fl:"fl 1.5s infinite",pd:"pd 2s infinite"}
}}};
</script>
<style>
html,body{height:100%}
body{font-family:"Segoe UI",Arial,sans-serif}
/* nền Figma-2: poster mờ sáng + blobs tím */
#playbg{position:absolute;inset:0;overflow:hidden}
#playbg img{width:110%;height:100%;object-fit:cover;object-position:center top;filter:blur(2px) brightness(.6)}
#playbg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,51,.88),rgba(20,20,51,.5) 60%,rgba(20,20,51,.3))}
.blob{position:absolute;border-radius:9999px;filter:blur(130px);pointer-events:none}
.pcw{transition:transform .3s}
.pcw:hover{transform:translateY(-8px)}
.pcw svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));transition:filter .2s}
.pcw:hover svg{filter:brightness(.72) drop-shadow(0 6px 16px rgba(0,0,0,.5))}
.modal-hidden{opacity:0;visibility:hidden}
.modal-hidden .modal-panel{transform:scale(.94)}
.toast-hidden{transform:translateY(80px);opacity:0}
.gname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.tick-msg{display:inline-block;white-space:nowrap;animation:tickmove 32s linear infinite}
@keyframes tickmove{from{transform:translateX(60vw)}to{transform:translateX(-100%)}}
*::-webkit-scrollbar{width:5px;height:5px}
*::-webkit-scrollbar-thumb{background:#0284C7;border-radius:3px}
</style>
</head>
<body class="text-slate-100">
<div id="app" class="relative w-screen h-screen flex flex-col overflow-hidden bg-[#141433]">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFCC05"/><stop offset=".51" stop-color="#E41865"/><stop offset="1" stop-color="#873A93"/>
    </linearGradient>
    <clipPath id="cutL"><path d="M0.5 11.8C0.5 5.3 6.4 0.4 12.8 1.6L135.1 24.8C140 25.7 143.5 30 143.5 35V182.9C143.5 188.6 138.9 193.2 133.2 193.2H10.8C5.1 193.2 0.5 188.6 0.5 182.9V11.8Z"/></clipPath>
    <clipPath id="cutR"><path d="M130.8 1.5C137.2 0.4 143 5.2 143 11.7V182.9C143 188.6 138.4 193.2 132.7 193.2H10.3C4.6 193.2 0 188.6 0 182.9V33.9C0 28.9 3.6 24.7 8.5 23.8L130.8 1.5Z"/></clipPath>
    <path id="edgeL" d="M0.5 11.8C0.5 5.3 6.4 0.4 12.8 1.6L135.1 24.8C140 25.7 143.5 30 143.5 35V182.9C143.5 188.6 138.9 193.2 133.2 193.2H10.8C5.1 193.2 0.5 188.6 0.5 182.9V11.8Z" fill="none"/>
    <path id="edgeR" d="M130.8 1.5C137.2 0.4 143 5.2 143 11.7V182.9C143 188.6 138.4 193.2 132.7 193.2H10.3C4.6 193.2 0 188.6 0 182.9V33.9C0 28.9 3.6 24.7 8.5 23.8L130.8 1.5Z" fill="none"/>
  </defs></svg>

  <!-- BACKGROUND -->
  <div id="playbg"><img id="playbgImg" src="assets/Background.png" alt=""></div>
  <div class="blob w-[700px] h-[380px] left-[28%] top-[22%] bg-fuchsia-900 opacity-40"></div>
  <div class="blob w-[720px] h-[380px] -left-[15%] top-[48%] bg-indigo-950 opacity-70"></div>
  <div class="blob w-[690px] h-[380px] -left-[14%] -top-[16%] bg-fuchsia-900 opacity-40"></div>

  <!-- HEADER -->
  <header class="relative z-10 min-h-[64px] px-4 flex flex-wrap items-center gap-x-4 gap-y-2 py-2">
    <div id="btnBrand" class="flex items-center cursor-pointer shrink-0" title="Về danh sách game">
      <img src="icon.png" alt="Ting" class="w-11 h-11 object-contain drop-shadow-[0_0_8px_rgba(244,63,94,.6)] hover:scale-110 transition-transform" onerror="this.style.display='none'">
    </div>
    <div class="text-lg whitespace-nowrap shrink-0">Máy: <b class="font-extrabold">B-05</b></div>
    <nav id="pills" class="flex items-center gap-1 bg-white/10 rounded-full p-1 shrink-0 overflow-x-auto max-w-full">
      <button class="pill px-4 sm:px-6 py-1.5 rounded-full text-sm text-slate-300 hover:text-white whitespace-nowrap" data-cat="all">All</button>
      <button class="pill px-4 sm:px-6 py-1.5 rounded-full text-sm text-slate-300 hover:text-white whitespace-nowrap" data-cat="online">Online</button>
      <button class="pill px-4 sm:px-6 py-1.5 rounded-full text-sm text-slate-300 hover:text-white whitespace-nowrap" data-cat="offline">Offline</button>
      <button class="pill px-4 sm:px-6 py-1.5 rounded-full text-sm text-slate-300 hover:text-white whitespace-nowrap" data-cat="tool">Tools</button>
    </nav>
    <div class="flex-1 min-w-[140px] max-w-full sm:max-w-[300px] xl:max-w-[380px] sm:ml-auto">
      <div class="h-[42px] flex items-center bg-white/10 rounded-full pl-5 pr-2 focus-within:bg-white/[.14]">
        <input id="srch" type="text" placeholder="Find your games......." aria-label="Tìm game"
          class="flex-1 min-w-0 bg-transparent outline-none text-sm placeholder:text-white/40">
        <button id="srchBtn" title="Tìm kiếm" class="w-[30px] h-[30px] shrink-0 text-white text-lg">⌕</button>
      </div>
    </div>
    <button id="btnBell" title="Thông báo" class="relative w-[42px] h-[42px] rounded-full bg-white/10 text-lg shrink-0 hover:bg-white/20">🔔<span class="dot absolute top-[10px] right-[11px] w-2 h-2 rounded-full bg-rose-500"></span></button>
    <button id="btnFnb" class="hidden sm:flex items-center gap-2 h-[42px] px-4 bg-orange-500/10 border border-orange-500/40 rounded-full text-orange-400 text-sm font-semibold whitespace-nowrap hover:bg-orange-500/25 shrink-0">🍔<span>Order Đồ Ăn</span></button>
    <div class="hidden md:flex gap-2 items-center text-slate-400 shrink-0">
      <button id="btnMin" title="Thu nhỏ xuống Taskbar" class="text-xl px-1 hover:text-white">—</button>
      <button id="btnMax" title="Phóng to / Khôi phục" class="text-lg px-1 hover:text-white">▢</button>
    </div>
  </header>

  <!-- TICKER -->
  <div class="relative z-[9] h-[26px] mx-4 flex items-center justify-center overflow-hidden text-xs">
    <span class="tick-msg flex gap-1">
      <span class="text-amber-400 font-extrabold mr-2 shrink-0">[HOT]</span>
      <span class="text-slate-200">Nạp Gio Vang 12h-14h Tang 100% Thoi Gian Choi &nbsp;•&nbsp; Giai Dau CS2 &amp; LoL Cyber Cup 2026 - Dang Ky Mien Phi Tai Quay &nbsp;•&nbsp; Black Myth Wukong &amp; Cyberpunk 2077 Vua Cap Nhat Ban Moi!</span>
    </span>
  </div>

  <!-- BODY -->
  <div class="relative z-[1] flex-1 flex flex-col min-h-0 px-5 sm:px-4 pt-1.5 gap-2.5">
    <section class="flex-1 min-h-0 bg-white/10 backdrop-blur-md border border-white/[.06] rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,.35)] p-3 sm:p-4 overflow-hidden flex flex-col">
      <div id="gamesGrid" class="flex-1 min-h-0 overflow-y-auto grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 xl:grid-cols-12 2xl:grid-cols-14 qhd:grid-cols-16 uhd:grid-cols-20 gap-x-1.5 gap-y-2.5 content-start px-0.5 py-1 pe-3"></div>
    </section>
    <section class="shrink-0 bg-white/10 backdrop-blur-md border border-white/[.06] rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,.35)] px-3 sm:px-4 pt-2.5 pb-2">
      <div id="posterStrip" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-7 lg:grid-cols-9 gap-2 sm:gap-3"></div>
    </section>
  </div>

  <!-- FOOTER -->
  <footer class="relative z-10 min-h-[34px] mx-3 sm:mx-4 my-2 px-1.5 flex items-center justify-between text-xs text-slate-400">
    <div class="flex items-center gap-3.5">
      <span title="Kênh cộng đồng" class="w-[22px] h-[22px] inline-flex items-center justify-center border-[1.5px] border-slate-500 rounded-[5px] text-slate-400 text-xs font-extrabold cursor-pointer hover:text-white hover:border-white">f</span>
      <span title="Kênh cộng đồng" class="w-[22px] h-[22px] inline-flex items-center justify-center border-[1.5px] border-slate-500 rounded-[5px] text-slate-400 text-xs font-extrabold cursor-pointer hover:text-white hover:border-white">f</span>
      <span title="Kênh video" class="w-[22px] h-[22px] inline-flex items-center justify-center border-[1.5px] border-slate-500 rounded-[5px] text-slate-400 text-[10px] font-extrabold cursor-pointer hover:text-white hover:border-white">▶</span>
    </div>
    <div class="flex items-center gap-2 font-semibold text-slate-300"><span>Ting Menu V0.1.0</span><span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_#10B981]"></span></div>
  </footer>
</div>

<!-- MODAL -->
<div id="modal" class="modal-hidden fixed inset-0 z-[1000] bg-[#040810]/85 backdrop-blur-[14px] flex items-center justify-center transition-all duration-200">
  <div class="modal-panel relative w-[720px] max-w-[92vw] max-h-[92vh] overflow-y-auto bg-[#0A1220] border border-white/10 rounded-2xl transition-transform duration-200">
    <div class="relative h-[200px] sm:h-[220px] overflow-hidden bg-[#111a2e]">
      <img id="mhImg" src="" alt="" class="w-full h-full object-cover object-top">
      <div class="absolute inset-0 bg-gradient-to-t from-[#0A1220] via-[#0A1220]/40 to-transparent"></div>
    </div>
    <button id="mClose" title="Đóng" class="absolute top-3.5 right-3.5 z-[2] w-[34px] h-[34px] rounded-full bg-black/55 border border-white/20 text-white hover:bg-red-500/80">✕</button>
    <div class="px-5 sm:px-7 pb-6 sm:pb-7">
      <div class="flex items-end gap-4 -mt-11 mb-4 relative z-[2]">
        <img id="mIco" src="" alt="" class="w-20 h-20 rounded-2xl object-cover border border-amber-400/60 shadow-2xl">
        <div class="min-w-0">
          <div id="mTit" class="text-xl sm:text-2xl font-extrabold truncate">Game</div>
          <div class="flex gap-1.5 flex-wrap mt-1.5">
            <span id="mGen" class="text-[10.5px] font-semibold px-2.5 py-[3px] rounded bg-white/10 text-slate-400">-</span>
            <span id="mSt" class="text-[10.5px] font-semibold px-2.5 py-[3px] rounded bg-white/10 text-slate-400">-</span>
          </div>
        </div>
      </div>
      <div id="rba" class="hidden items-center gap-2.5 bg-amberflex gap-3-500/10 border border-amber-500/40 rounded-lg px-3.5 py-3 mb-4 text-amber-500 text-xs">⚠️<span>Bản cập nhật yêu cầu <strong>khởi động lại máy</strong> trước khi chơi.</span></div>
      <div class="flex gap-3 mt-11">
        <button id="bLaunch" class="flex-1 h-[46px] rounded-[10px] bg-gradient-to-br from-[#FFCC05] to-amber-600 text-[#231a02] text-sm font-extrabold tracking-widest uppercase flex items-center justify-center gap-2 hover:brightness-110 disabled:opacity-60"><span>▶</span><span id="bLTxt">CHƠI NGAY</span></button>
        <button id="bFolder" class="h-[46px] px-4 rounded-[10px] bg-white/5 border border-white/10 text-slate-400 text-xs font-semibold hover:bg-white/10">📁 Mở thư mục</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast-hidden fixed bottom-[52px] right-[22px] z-[2000] px-4 py-3 rounded-lg bg-[#0A1220]/95 border border-amber-400/70 flex items-center gap-2.5 text-xs max-w-[400px] transition-all duration-300"><span id="tIco">🎮</span><span id="tMsg">Thông báo</span></div>

<script>
"use strict";
/* Model RAM-only (như RamCache app thật). Telemetry log ra console thay vì POST LAN. */
const GAMES=[
  {id:"lol",name:"League of Legends",cat:"online",genre:"MOBA",status:"ready",size:"22.4 GB",ver:"14.18",exe:"LeagueClient.exe",path:"G:\\Online\\League of Legends\\LeagueClient.exe",icon:"assets/source/game-lol.png",poster:"assets/source/poster-lol.png"},
  {id:"gta5",name:"Grand Theft Auto V",cat:"offline",genre:"Thế giới mở",status:"ready",size:"110 GB",ver:"1.0.3095",exe:"GTA5.exe",path:"G:\\Offline\\GTA V\\GTA5.exe",icon:"assets/source/game-gta.png",poster:"assets/source/game-gta-poster.png"},
  {id:"cs2",name:"Counter-Strike 2",cat:"online",genre:"FPS",status:"ready",size:"35.2 GB",ver:"1.40.2",exe:"cs2.exe",path:"G:\\Online\\Counter-Strike 2\\cs2.exe",icon:"assets/source/game-counter-strike.png",poster:"assets/source/game-counter-strike.png"},
  {id:"hitman",name:"Hitman: World of Assassination",cat:"offline",genre:"Hành động",status:"ready",size:"75 GB",ver:"3.180",exe:"HITMAN3.exe",path:"G:\\Offline\\Hitman 3\\HITMAN3.exe",icon:"assets/source/game-hitman.png",poster:"assets/source/game-hitman.png"},
  {id:"hl",name:"Half Life 1.1",cat:"offline",genre:"FPS cổ điển",status:"reboot",size:"1.2 GB",ver:"1.1",exe:"hl.exe",path:"G:\\Offline\\Half Life\\hl.exe",icon:"assets/source/game-counter-strike.png",poster:"assets/source/poster-pubg.png"},
  {id:"aoe",name:"Age of Empires",cat:"offline",genre:"Chiến thuật RTS",status:"waiting",size:"2.5 GB",ver:"1.0c",exe:"EMPIRESX.EXE",path:"G:\\Offline\\AOE\\EMPIRESX.EXE",icon:"assets/source/game-aoe.png",poster:"assets/source/game-aoe.png"},
  {id:"fc",name:"EA SPORTS FC Online",cat:"online",genre:"Bóng đá",status:"updating",size:"36.8 GB",ver:"2024.09",exe:"FC_Online.exe",path:"G:\\Online\\FC Online\\FC_Online.exe",icon:"assets/source/game-fo4.png",poster:"assets/source/game-fo4.png"},
  {id:"ntkt",name:"Nghịch Thiên Kiếm Thế",cat:"online",genre:"MMORPG",status:"ready",size:"14.5 GB",ver:"2.1",exe:"game.exe",path:"G:\\Online\\Nghịch Thiên\\game.exe",icon:"assets/source/game-nghich-thien.png",poster:"assets/source/game-nghich-thien.png"},
  {id:"dota2",name:"Dota 2",cat:"online",genre:"MOBA Esports",status:"ready",size:"58.6 GB",ver:"7.37",exe:"dota2.exe",path:"G:\\Online\\Dota 2\\dota2.exe",icon:"assets/source/game-lol.png",poster:"assets/source/poster-dota2.png"},
  {id:"cp",name:"Cyberpunk 2077",cat:"offline",genre:"Hành động RPG",status:"ready",size:"83.4 GB",ver:"2.13",exe:"Cyberpunk2077.exe",path:"G:\\Offline\\Cyberpunk 2077\\Cyberpunk2077.exe",icon:"assets/source/game-gta.png",poster:"assets/source/poster-cyberpunk.png"},
  {id:"sup",name:"Ting Remote Support",cat:"tool",genre:"Hỗ trợ kỹ thuật",status:"ready",size:"42 MB",ver:"0.1.0",exe:"ting-support.exe",path:"G:\\TingMenu\\ting-support.exe",icon:"icon.png",poster:"assets/source/logo.png"},
  {id:"cfg",name:"Ting System Settings",cat:"tool",genre:"Cài đặt hệ thống",status:"ready",size:"18 MB",ver:"0.1.0",exe:"ting-settings.exe",path:"G:\\TingMenu\\ting-settings.exe",icon:"assets/source/logo.png",poster:"icon.png"}
];
const POSTERS=[
  {name:"League of Legends",poster:"assets/source/poster-lol.png",id:"lol"},
  {name:"Dota 2",poster:"assets/source/poster-dota2.png",id:"dota2"},
  {name:"Counter-Strike 2",poster:"assets/source/game-counter-strike.png",id:"cs2"},
  {name:"Grand Theft Auto V",poster:"assets/source/game-gta-poster.png",id:"gta5"},
  {name:"Cyberpunk 2077",poster:"assets/source/poster-cyberpunk.png",id:"cp"},
  {name:"EA SPORTS FC Online",poster:"assets/source/game-fo4.png",id:"fc"},
  {name:"Hitman 3",poster:"assets/source/game-hitman.png",id:"hitman"},
  {name:"Nghịch Thiên Kiếm Thế",poster:"assets/source/game-nghich-thien.png",id:"ntkt"},
  {name:"Age of Empires",poster:"assets/source/game-aoe.png",id:"aoe"}
];
let curCat="all",searchQ="",selGame=null,launching=false;
const teleQ=[];
function tele(ev,id,flush){teleQ.push({ev,id,at:new Date().toISOString()});console.log("[telemetry"+(flush?" flush":"")+"]",ev,id);if(flush&&teleQ.length)teleQ.length=0;}
setInterval(()=>{if(teleQ.length){console.log("[telemetry batch]",teleQ.length,"events");teleQ.length=0;}},30000);
const $=id=>document.getElementById(id);
const gg=$("gamesGrid"),ps=$("posterStrip"),modal=$("modal");
const DOT={ready:"bg-emerald-500 shadow-[0_0_7px_#10B981]",updating:"bg-sky-400 shadow-[0_0_7px_#38BDF8] animate-spinSlow",reboot:"bg-amber-500 shadow-[0_0_7px_#F59E0B] animate-fl",waiting:"bg-slate-600"};
const LBL={ready:"Sẵn sàng",updating:"Đang cập nhật",reboot:"Cần khởi động lại",waiting:"Chờ tải"};
function launchable(g){return g.status==="ready"||g.status==="reboot";}
function filtered(){return GAMES.filter(g=>(curCat==="all"||g.cat===curCat)&&(!searchQ||g.name.toLowerCase().includes(searchQ)));}
function setCat(c){curCat=c;
  document.querySelectorAll("#pills .pill").forEach(p=>{
    const on=p.dataset.cat===c;
    p.classList.toggle("bg-gradient-to-r",on);p.classList.toggle("from-fuchsia-500",on);p.classList.toggle("to-purple-800",on);
    p.classList.toggle("text-white",on);p.classList.toggle("font-semibold",on);p.classList.toggle("shadow-[0_0_14px_rgba(168,85,247,.5)]",on);
    p.classList.toggle("text-slate-300",!on);
  });
  renderGrid();}
/* Game card theo Ting-Menu-2.svg: icon bo góc + tên 2 dòng + dot trạng thái */
function renderGrid(){
  const f=filtered();
  if(!f.length){gg.innerHTML='<div class="col-span-full py-12 text-center text-slate-500"><div class="text-3xl mb-2">🔍</div><div class="text-sm font-semibold">Không tìm thấy game phù hợp</div><div class="text-xs">Thử từ khóa hoặc nhóm game khác.</div></div>';return;}
  gg.innerHTML=f.map(g=>'<button class="gc group flex flex-col items-center pt-4 p-1.5 rounded-[10px] hover:bg-amber-400/10 hover:-translate-y-1 transition-all min-w-0" data-id="'+g.id+'" title="'+g.name+' — '+LBL[g.status]+'">'
    +'<span class="relative block w-[56px] h-[56px] sm:w-[62px] sm:h-[62px] qhd:w-20 qhd:h-20 uhd:w-28 uhd:h-28 mb-1.5 shrink-0">'
    +'<img src="'+g.icon+'" alt="" loading="lazy" onerror="this.src=\'icon.png\'" class="w-full h-full rounded-[15px] object-cover shadow-[0_4px_12px_rgba(0,0,0,.5)] group-hover:scale-105 transition-transform">'
    +'<span class="absolute -top-[3px] -right-[3px] w-3 h-3 rounded-full border-2 border-[#1a1a3a] '+(DOT[g.status]||"bg-slate-600")+'"></span></span>'
    +'<span class="gname w-full text-center text-[11px] qhd:text-sm uhd:text-lg font-medium text-slate-200 group-hover:text-amber-300">'+g.name+'</span></button>').join("");
  gg.querySelectorAll(".gc").forEach(c=>c.addEventListener("click",()=>{const g=GAMES.find(x=>x.id===c.dataset.id);if(g)openModal(g);}));
}
function renderPosters(){
  ps.innerHTML=POSTERS.map((p,i)=>{
    const cut=i%2?"cutR":"cutL",edge=i%2?"edgeR":"edgeL";
    return '<div class="pcw group cursor-pointer min-w-0" data-id="'+p.id+'">'
    +'<div class="relative"><svg viewBox="0 0 144 194"><image href="'+p.poster+'" x="0" y="0" width="144" height="194" preserveAspectRatio="xMidYMid slice" clip-path="url(#'+cut+')"/><use href="#'+edge+'" stroke="url(#cardEdge)" stroke-width="1.5"/></svg>'
    +'<div class="absolute inset-0 hidden sm:flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"><div class="w-14 h-14 qhd:w-18 qhd:h-18 rounded-full bg-gradient-to-r from-fuchsia-400 to-purple-600 flex items-center justify-center text-[#231a02] text-base qhd:text-xl shadow-[0_0_18px_rgba(255,204,5,.55)] scale-75 group-hover:scale-100 transition-transform">▶</div></div></div>'
    +'<div class="mt-1.5 text-xs qhd:text-sm uhd:text-lg font-semibold text-slate-300 text-center truncate">'+p.name+'</div></div>';
  }).join("");
  ps.querySelectorAll(".pcw").forEach(c=>c.addEventListener("click",()=>{const g=GAMES.find(x=>x.id===c.dataset.id);if(g)openModal(g);}));
}
const TAGC={ready:["bg-emerald-500/10 border-emerald-500/40 text-emerald-400","Sẵn sàng"],reboot:["bg-amber-500/10 border-amber-500/40 text-amber-500","Cần khởi động lại"],updating:["bg-sky-500/10 border-sky-500/40 text-sky-400","Đang cập nhật"],waiting:["bg-white/10 border-white/10 text-slate-400","Chờ tải"]};
function openModal(g){
  selGame=g;launching=false;tele("click",g.id,false);
  $("mhImg").src=g.poster||"";$("mhImg").onerror=function(){this.style.display="none";};$("mhImg").style.display="";
  $("mIco").src=g.icon;$("mIco").onerror=function(){this.src="icon.png";};
  $("mTit").textContent=g.name;$("mGen").textContent=g.genre;
  const tc=TAGC[g.status]||TAGC.waiting,st=$("mSt");
  st.textContent=tc[1];st.className="text-[10.5px] font-semibold px-2.5 py-[3px] rounded border "+tc[0];
  const bl=$("bLaunch"),bt=$("bLTxt");
  $("rba").classList.toggle("hidden",g.status!=="reboot");$("rba").classList.toggle("flex",g.status==="reboot");
  bl.classList.toggle("from-amber-400",g.status==="reboot");bl.classList.toggle("to-amber-700",g.status==="reboot");
  bl.classList.toggle("from-[#FFCC05]",g.status!=="reboot");bl.classList.toggle("to-amber-600",g.status!=="reboot");
  bl.classList.toggle("from-orange-400",g.status==="reboot");bl.classList.toggle("to-orange-700",g.status==="reboot");
  bl.disabled=!launchable(g);
  bt.textContent=g.status==="reboot"?"KHỞI ĐỘNG LẠI MÁY ĐỂ CHƠI":g.status==="updating"?"ĐANG TẢI...":g.status==="waiting"?"CHỜ TẢI":"CHƠI NGAY";
  modal.classList.remove("modal-hidden");
}
function closeModal(){modal.classList.add("modal-hidden");selGame=null;launching=false;}
let tt;
function showToast(ico,msg){$("tIco").textContent=ico;$("tMsg").textContent=msg;const el=$("toast");el.classList.remove("toast-hidden");clearTimeout(tt);tt=setTimeout(()=>el.classList.add("toast-hidden"),3500);}
document.querySelectorAll("#pills .pill").forEach(p=>p.addEventListener("click",()=>setCat(p.dataset.cat)));
let st;$("srch").addEventListener("input",e=>{clearTimeout(st);st=setTimeout(()=>{searchQ=e.target.value.trim().toLowerCase();renderGrid();},120);});
$("srchBtn").addEventListener("click",()=>{searchQ=$("srch").value.trim().toLowerCase();renderGrid();});
window.addEventListener("keydown",e=>{
  if((e.ctrlKey&&(e.key==="k"||e.key==="K"))||(e.key==="/"&&document.activeElement!==$("srch"))){e.preventDefault();$("srch").focus();$("srch").select();}
  if(e.key==="Escape"&&!modal.classList.contains("modal-hidden"))closeModal();
});
$("mClose").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
$("bLaunch").addEventListener("click",()=>{
  if(!selGame||launching||!launchable(selGame))return;
  if(selGame.status==="reboot"){showToast("⚠️","Cần khởi động lại máy trước khi chơi "+selGame.name+".");return;}
  launching=true;$("bLTxt").textContent="ĐANG MỞ...";$("bLaunch").disabled=true;
  setTimeout(()=>{
    tele("launch",selGame.id,true);
    showToast("🚀","Đã khởi chạy "+selGame.name+". Ting Menu thu nhỏ về Taskbar.");
    closeModal();
  },900);
});
$("bFolder").addEventListener("click",()=>{if(selGame)showToast("📁","Mở thư mục: "+selGame.path);});
$("btnBrand").addEventListener("click",()=>{searchQ="";$("srch").value="";setCat("all");});
$("btnFnb").addEventListener("click",()=>showToast("🍔","Kích hoạt Ting Launcher - Gọi món & nạp tiền."));
$("btnBell").addEventListener("click",e=>{e.currentTarget.querySelector(".dot").style.display="none";showToast("🔔","3 tin mới: Cyber Cup 2026, giờ vàng 12h-14h, bản cập nhật mới.");});
$("btnMin").addEventListener("click",()=>showToast("—","Thu nhỏ cửa sổ xuống Taskbar."));
$("btnMax").addEventListener("click",()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});});
setCat("all");renderPosters();
const qp=new URLSearchParams(location.search).get("play")||new URLSearchParams(location.search).get("game");
if(qp){const g=GAMES.find(x=>x.id===qp);if(g)openModal(g);}
</script>
</body>
</html>
