 function pay(oid){const o=db.orders.find(o=>o.id===oid);if(!finance()||!o||!['waiting','review'].includes(o.state))return fail('Đơn không còn chờ xác nhận.');modal('Đối chiếu thanh toán',form('pay',`<p>Đơn <b>${esc(o.id)}</b> · phải nhận đủ <b>${money(o.total)}</b>. Chỉ xác nhận khi đã đối chiếu.</p>`+field('Số tiền thực nhận','amount','','number','required min="1" step="1"')+field('Mã giao dịch / ghi chú đối chiếu','reference','','text','required'),oid));}
  function finishPayment(o){if(!finance()||!['waiting','review'].includes(o.state))return false; if(o.kind==='renew'){const r=db.rooms.find(r=>r.id===o.room);if(!r||r.revoked||r.type==='trial'||!db.keys.some(k=>k.room===r.id&&k.state==='active'))return fail('Phòng chưa có license để gia hạn.');r.until=addYear(Date.parse(r.until)>Date.parse(NOW)?r.until:NOW);r.type='paid';}else{for(let n=0;n<o.quantity;n++){const kid=id('K');db.keys.push({id:kid,text:`DEMO0-${kid.padEnd(5,'X')}-AAAAA-BBBBB-CCCCC`,owner:o.owner,state:'unused',room:null,order:o.id});}}o.state='paid';if(o.kind==='buy'&&o.oldOffer&&!db.bonuses.some(b=>b.room===o.room&&['pending','approved'].includes(b.state))){const days=Math.min(30,Math.ceil((Date.parse(o.oldOffer.until+'T23:59:59+07:00')-Date.parse(NOW))/86400000));if(days>0)db.bonuses.push({id:id('UD'),owner:o.owner,room:o.room,order:o.id,software:o.oldOffer.software,oldLicenseUntil:o.oldOffer.until,evidence:o.oldOffer.evidence,days,state:'pending',applied:false});}log(`Xác nhận tiền ${o.id}; ${o.kind==='renew'?'gia hạn':'cấp '+o.quantity+' key'} một lần`);return true;}

 function roomDetail(rid){if(actor==='accountant')return;const r=db.rooms.find(r=>r.id===rid&&roomMine(r));if(!r)return;modal(esc(r.name),`<p>${badge(r.type==='paid'?'paidroom':r.type)} · Hạn: ${r.type==='trial'?('Dùng thử 30 ngày (đến '+date(r.until)+')'):date(r.until)}</p><p>${r.pcs} máy · Đồng bộ: ${esc(r.seen)}</p>${db.keys.filter(k=>k.room===r.id&&mine(k)).map(k=>`<p class="key">${esc(k.text)} ${btn('Sao chép','copy',k.id)}</p>`).join('')}<div class="row">${customer()&&!r.revoked?(r.type==='trial'?btn('Mua 1 key','purchase'):btn('Gia hạn 12 tháng','renew',r.id,'primary'))+btn('Đề nghị ưu đãi','bonus-request',r.id):''}${actor==='admin'&&!r.revoked?btn('Chuyển người phụ trách','assign',r.id)+btn('Thu hồi phòng','room-revoke',r.id,'danger'):''}</div>`);}
 function renderUpdate(){const u=db.update,r=db.rooms.find(r=>r.id===u.room);const paid=r.type==='paid';const expired=u.scenario==='expired'||u.scenario==='new'||u.scenario==='paid-expired';const offline=u.scenario==='offline';const o=db.orders.find(o=>o.id===u.order);$('#app').innerHTML=`<div class="banner">DEMO TING UPDATE · Luồng dự kiến, chưa nối server. Dùng cùng dữ liệu mẫu với Console.</div><div class="update"><header><div class="brand"><b>ting</b> update</div><select id="scenario" aria-label="Kịch bản bản quyền">${[['trial','Trial còn hạn'],['new','Mới cài, mua lần đầu'],['expired','Hết trial / chưa có key'],['offline','Mới cài, mất mạng'],['paid','License 12 tháng'],['paid-expired','License đã hết hạn']].map(([v,t])=>`<option value="${v}" ${u.scenario===v?'selected':''}>${t}</option>`).join('')}</select></header><div class="hero"><h1>${offline?'Cần kết nối Internet':paid&&!expired?'Đã kích hoạt Ting Update':expired?'Cần kích hoạt để tiếp tục':'Đã tự động bật dùng thử'}</h1><p>${offline?'Kết nối để server kiểm tra quyền dùng thử. Không cần mã KTV.':paid&&!expired?'License 12 tháng · Hạn '+date(r.until):expired?'Nhập key đã mua hoặc đặt mua ngay tại đây.':'Đang trong thời gian dùng thử 1 tháng (30 ngày độc lập). Không cần mã KTV.'}</p><span class="sub">Phòng: ${esc(r.name)} · Nhận diện máy tự động</span></div>${offline?btn('Mô phỏng kết nối lại','reconnect','','primary'):`<div class="cards"><div class="card"><h2>Tôi đã có key</h2><form data-form="activate"><label>Key text<input name="key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required></label><p>${btn('Kích hoạt','submit','','primary')}</p><p class="error" id="form-error"></p></form></div><div class="card"><h2>${paid||u.scenario==='paid-expired'?'Gia hạn cho phòng':'Mua 1 key'}</h2><div class="money">${money(db.settings.price)} <small>/ 12 tháng</small></div><p>Thanh toán đủ một lần, kế toán xác nhận. Không cần đăng ký Console để mua.</p>${r.owner==='owner'?btn(paid||u.scenario==='paid-expired'?'Đặt gia hạn':'Đặt mua 1 key',paid||u.scenario==='paid-expired'?'renew':'quick-buy',paid||u.scenario==='paid-expired'?r.id:'','primary'):'<p class="sub">Phòng này do KTV quản lý; liên hệ KTV để mua/gia hạn.</p>'}</div></div>`}${o?`<div class="card"><div class="row spread"><h2>Đơn đang theo dõi · ${esc(o.id)}</h2>${badge(o.state)}</div><p>${money(o.total)} · ${esc(o.bank)} · ${esc(o.account)} · Nội dung: ${esc(o.id)}</p>${btn('Xem hướng dẫn / key','order',o.id)}${o.state==='paid'?db.keys.filter(k=>k.order===o.id).map(k=>`<p class="key">${esc(k.text)} ${btn('Điền key','fill-key',k.id)}</p>`).join(''):''}<p class="sub">Đóng/mở lại vẫn giữ đơn. Demo: mở Console cùng địa chỉ máy chủ, đổi sang Kế toán để duyệt.</p></div>`:''}<footer>${btn('Mở Console mẫu','open-console')} ${btn('Reset dữ liệu','reset')} ${!expired&&!offline?btn('Vào màn hình cập nhật game','enter-update','','primary'):''}<p>Không gửi dữ liệu, tiền hoặc tin nhắn thật. Không yêu cầu JSON.</p></footer></div>`;}
  function activate(text){if(actor!=='owner'||mode!=='update')return;const k=db.keys.find(k=>k.text===text.trim().toUpperCase()),r=db.rooms.find(r=>r.id===db.update.room);if(!r||r.revoked)return fail('Phòng không còn được phép kích hoạt.');if(!k||!(k.owner==='owner'||(k.owner==='guest'&&k.order===db.update.order))||db.orders.find(o=>o.id===k.order)?.state!=='paid')return fail('Key không hợp lệ cho phòng mẫu này. Dùng key từ đơn đã được kế toán duyệt.');if(!['unused','active'].includes(k.state))return fail('Key đã bị thu hồi hoặc đang chờ hoàn.');if(k.room&&k.room!==r.id)return fail('Key đang dùng cho phòng khác. Vui lòng liên hệ hỗ trợ.');if(k.state==='unused'){if(r.type==='paid')return fail('Phòng đã có license. Hãy gia hạn key hiện tại.');k.state='active';k.room=r.id;r.until=addYear(NOW);r.type='paid';const bonus=db.bonuses.find(b=>b.order===k.order&&b.room===r.id&&b.state==='approved'&&!b.applied);if(bonus){r.until=addDays(r.until,bonus.days);bonus.applied=true;}log(`Kích hoạt ${k.id} cho ${r.name}`);}db.update.scenario='paid';save();render();notice('Đã kích hoạt; nhập lại key không tính lại hạn.');}

    s={id:id('ST'),month,tech,count:actRooms.length,amount:actRooms.length*db.settings.price,state:'paid',invoiceRef:'HD-'+month+'-001',paidRef:v.paidRef.trim(),closedAt:NOW};
    db.settlements.unshift(s);
  }else{
    s.state='paid';
    s.paidRef=v.paidRef.trim();
  }
  log('Xác nhận thanh toán kỳ chốt '+month+' của KTV '+tech+' · Mã: '+v.paidRef);
  notice('Đã xác nhận thanh toán kỳ chốt '+month);
  break;
}
case 'license-activate':{
  const r=db.rooms.find(x=>x.id===v.room);
  if(!r)return fail('Không tìm thấy phòng máy.');
  if(v.kind==='trial'){
    r.type='trial';
    r.until=addDays(NOW,30);
    log('Cấp dùng thử 30 ngày cho phòng '+r.name);
    notice('Đã cấp Dùng thử 1 tháng (30 ngày) cho '+r.name);
  }else if(v.kind==='yearly'||(actor==='ktv')){
    const targetTech=r.tech||actor;
    const pool=db.keyPools[targetTech]||{allocated:0,activated:0};
    if(pool.allocated<=pool.activated)return fail('Kho key của KTV đã hết hạn mức (0 key khả dụng). Hãy liên hệ Admin cấp thêm.');
    pool.activated++;
    r.type='paid';
    r.until=addYear(NOW);
    r.activatedAt=NOW;
    r.settlementMonth=statsMonth||'2026-10';
    const kid=id('K');
    db.keys.push({id:kid,text:'TING1-'+kid.padEnd(5,'X')+'-POOL-YEAR',owner:targetTech,state:'active',room:r.id,order:'POOL'});
    log('Kích hoạt 1 năm cho phòng '+r.name+' từ kho KTV (Còn '+(pool.allocated-pool.activated)+' key)');
    notice('Đã kích hoạt 1 năm cho '+r.name+' (Trừ 1 key kho KTV)');
  }else if(v.kind==='retail'){
    r.type='paid';
    r.until=addYear(NOW);
    r.activatedAt=NOW;
    r.source='retail';
    const kid=id('K');
    db.keys.push({id:kid,text:'TING1-'+kid.padEnd(5,'X')+'-RETAIL-YEAR',owner:'owner',state:'active',room:r.id,order:'RETAIL'});
    log('Kích hoạt bản quyền 1 năm khách lẻ cho '+r.name+' · CK: '+v.reference);
    notice('Đã kích hoạt 1 năm khách lẻ cho '+r.name);
  }
  break;
}
 case 'room-add':{if(!['admin','ktv'].includes(actor))return;const ting=String(v.ting||'').trim().toUpperCase(),region=String(v.region||'').trim(),tech=db.accounts.find(a=>a.id===(actor==='admin'?v.tech:actor)&&a.role==='KTV'&&a.active);
 if(!/^TING-[A-Z0-9]{4}(-[A-Z0-9]{4}){3}$/.test(ting)||!v.name?.trim())return fail('Điền Ting ID và tên phòng hợp lệ.');
 if(db.rooms.some(r=>r.ting===ting))return fail('Ting ID đã được gán.');
 if(!tech||!(tech.regions||[]).includes(region))return fail('KTV phải phụ trách khu vực của phòng.');
 db.rooms.push({id:id('R'),ting,name:v.name.trim(),region,tech:tech.id,owner:tech.id,type:Date.parse(NOW)<Date.parse(trialCutoff)?'trial':'expired',until:trialCutoff,pcs:0,seen:'Chưa đồng bộ'});log('Gán phòng '+ting);break;}
 case 'room-revoke':{const r=db.rooms.find(r=>r.id===k);if(actor!=='admin'||!r||r.revoked)return;r.revoked=true;r.type='revoked';db.keys.filter(key=>key.room===r.id&&key.state==='active').forEach(key=>key.state='revoked');log('Thu hồi phòng '+r.name+' · '+v.reason);break;}
 case 'assign':{if(actor!=='admin')return;const r=db.rooms.find(x=>x.id===k),tech=db.accounts.find(a=>a.id===v.tech&&a.role==='KTV'&&a.active);if(!r||r.revoked||!tech||!(tech.regions||[]).includes(r.region))return fail('Chọn KTV cùng khu vực.');r.tech=tech.id;log('Chuyển KTV phụ trách '+r.name+' · '+v.reason+'; giữ người mua và đơn cũ');break;}
 case 'regions':if(actor!=='admin')return;db.accounts.find(x=>x.id===k).regions=v.regions.split(',').map(x=>x.trim()).filter(Boolean);log('Sửa khu vực '+k);break;
 case 'account-add':if(actor!=='admin')return;if(!v.password||v.password.length<12)return fail('Mật khẩu mẫu cần ít nhất 12 ký tự.');if(db.accounts.some(x=>x.id===v.id))return fail('Mã tài khoản đã tồn tại.');db.accounts.push({id:v.id,name:v.name,regions:v.regions.split(',').map(x=>x.trim()).filter(Boolean),role:'KTV',active:true});log('Tạo KTV '+v.name);break;
 case 'register':if(!['ktv','owner'].includes(v.role))return fail('Chỉ KTV hoặc chủ phòng được tự đăng ký.');actor=v.role;signedIn=true;sessionStorage.setItem('ting-demo-signed-out','0');people[actor].name=v.name+' · '+people[actor].role;db.profiles[actor]={name:v.name,email:v.email,phone:'',billing:'',verified:false};sessionStorage.setItem('ting-demo-actor',actor);page='home';log('Đăng ký mẫu; chờ xác minh email');notice('Đã tạo hồ sơ mẫu. Xác minh liên hệ được mô phỏng, không gửi email thật.');break;
 case 'login':{if(!Object.hasOwn(people,v.actor))return fail('Tài khoản mẫu không hợp lệ.');if(db.accounts.find(a=>a.id===v.actor)?.active===false)return fail('Tài khoản mẫu đã bị khóa.');actor=v.actor;signedIn=true;sessionStorage.setItem('ting-demo-signed-out','0');sessionStorage.setItem('ting-demo-actor',actor);page='home';break;}
 case 'forgot':close();notice('Nếu thông tin hợp lệ, hướng dẫn khôi phục sẽ được gửi. Demo không gửi email.');return;

 }close();render();notice('Đã lưu dữ liệu mẫu.');});
