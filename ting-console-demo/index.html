<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ting Console · Demo</title><style>
:root{color-scheme:dark;--bg:#111418;--panel:#191e23;--line:#2c343b;--text:#f8fafc;--muted:#a1a1aa;--accent:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;background:#22282d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 13px}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--accent);color:#06251c;font-weight:700}.danger{color:#ffabb2}a{color:var(--accent)}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{background:#191e23;border-right:1px solid var(--line);padding:25px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand b{color:var(--accent)}.sub{color:var(--muted);font-size:12px}.nav{display:grid;gap:5px;margin-top:25px}.nav button{text-align:left;border-color:transparent;background:none;color:var(--muted)}.nav button.active{background:#17382f;color:var(--accent);border-color:#285c4b}header{padding:17px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}main{padding:28px;max-width:1500px;margin:auto}.banner{padding:10px 18px;background:#242516;color:#e4d7a4;font-size:12px;border-bottom:1px solid #494529}h1{font-size:27px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0 16px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:22px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:21px}.stat{font-size:30px;font-weight:700;display:block;margin:6px 0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin:18px 0}table{width:100%;border-collapse:collapse;background:var(--panel);white-space:nowrap}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);background:#111418}td button{padding:5px 9px;margin:2px}.badge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;background:#223346}.ok{background:#123c31;color:#72e4b8}.warn{background:#423519;color:#ffd881}.bad{background:#43232d;color:#ffadb5}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.empty{padding:45px;text-align:center;color:var(--muted)}input,select,textarea{background:#191e23;color:var(--text);border:1px solid #2c343b;border-radius:7px;padding:10px;max-width:100%}input:not([type=checkbox]),textarea{width:100%}label{display:block;margin:13px 0 5px;color:var(--muted)}.form{max-width:680px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.search{max-width:300px}dialog{background:var(--panel);color:var(--text);border:1px solid #425773;border-radius:14px;width:min(460px,calc(100vw - 32px));max-height:88vh;padding:25px}dialog::backdrop{background:#020812bb;backdrop-filter:blur(3px)}dialog .close{float:right}.error{color:#ffabb2}.key{font:13px ui-monospace,monospace;letter-spacing:.4px}.timeline{padding-left:21px;border-left:2px solid #345344;margin:22px 0}.timeline p{position:relative}.timeline p:before{content:'●';position:absolute;left:-28px;color:var(--accent)}#notice{position:fixed;bottom:22px;right:22px;background:#174536;border:1px solid var(--accent);border-radius:9px;padding:12px 20px;max-width:420px;display:none;z-index:10}.auth{max-width:480px;margin:45px auto}.update{max-width:850px;margin:auto;padding:20px}.update header{padding:12px 0}.update .hero{padding:27px;margin:20px 0;background:linear-gradient(110deg,#183829,#12202e);border-radius:12px;border:1px solid #2c5140}.money{color:var(--accent);font-size:27px;font-weight:750}.help{border-left:3px solid var(--accent);padding-left:14px}.compact main{padding:18px}.pill{border:1px solid var(--line);border-radius:8px;padding:8px 12px}footer{color:var(--muted);font-size:12px;margin-top:28px}@media(max-width:780px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:12px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}main,header{padding:16px}.fields{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}h1{font-size:23px}}

/* Source: styles.css and MainLayout.tsx */
body{height:100dvh;overflow:hidden}.banner{height:32px;overflow:auto;white-space:nowrap;padding:6px 12px;background:var(--panel);color:var(--muted);border-color:var(--line)}
.shell{height:calc(100dvh - 32px);min-height:0;grid-template-columns:72px minmax(0,1fr)}.shell.expanded{grid-template-columns:240px minmax(0,1fr)}
aside{height:100%;position:relative;display:flex;flex-direction:column;align-items:center;padding:16px 12px;overflow:auto}
aside .brand,aside>.sub,aside>footer{display:none}.nav{margin-top:32px;width:100%;gap:16px}.nav button{width:40px;height:40px;padding:10px;border-radius:12px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.nav button.active{background:#10b9811a;color:#10b981;border-color:transparent}.nav svg,.menu-toggle svg{width:20px;height:20px;flex-shrink:0}.nav-label{display:none}.expanded .nav-label{display:inline;white-space:nowrap}.expanded .nav button{width:100%;height:44px}
.menu-toggle{height:40px;width:40px;padding:8px;background:var(--bg)}.sidebar-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:16px}
.shell>section{min-width:0;display:flex;flex-direction:column;overflow:hidden}header{padding:16px 32px;flex-shrink:0}header strong{font:700 18px Outfit,system-ui,sans-serif}header select,header button{padding:5px 9px;font-size:12px}
main{overflow:auto;padding:32px;max-width:none;margin:0;flex:1;min-height:0}h1{font:700 24px Outfit,system-ui,sans-serif}h2{font:600 18px Outfit,system-ui,sans-serif}button,input,select,textarea{border-radius:6px}th{background:var(--bg);text-transform:uppercase;letter-spacing:.04em}td{padding:16px 20px}th{padding:12px 20px}tr:hover td{background:#22282d}.primary{background:#10b981;color:#09090b}.card{padding:20px}
dialog{background:var(--bg);padding:24px;border-color:var(--line);max-height:calc(100dvh - 32px);overflow:auto}dialog::backdrop{background:#09090bcc}
body.light{color-scheme:light;--bg:#f1f5f9;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#475569}body.light button,body.light input,body.light select,body.light textarea{background:var(--panel);color:var(--text)}body.light .primary{background:#10b981}body.light tr:hover td{background:#f8fafc}
@media(max-width:780px){.shell,.shell.expanded{grid-template-columns:72px minmax(0,1fr)}aside{height:100%;padding:16px 12px}.nav{display:grid;overflow:visible}.expanded .nav-label{display:none}.expanded .nav button{width:40px}main,header{padding:16px}.cards{grid-template-columns:1fr}.tools{gap:4px}}

.shell.expanded .nav button{min-width:0}.shell.expanded .brand{display:block}.shell.expanded .nav{width:100%}

/* Ting Console uses the existing admin identity; never stretch the logo. */
.brand-button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:4px;width:100%;justify-content:center;flex-shrink:0}
.brand-button img{object-fit:contain;flex-shrink:0}.expanded .brand-button{justify-content:flex-start}.brand-button .nav-label{font:700 18px Outfit,system-ui,sans-serif}
.header-brand{display:flex;gap:10px;align-items:center}.header-brand img{object-fit:contain}
.nav{gap:6px;margin-top:20px}.nav button{flex-shrink:0}.game-toggle{display:flex;align-items:center;gap:7px;margin:0;font-size:12px;color:var(--text)}.game-toggle input{accent-color:#10b981}
.shell>aside{overflow-y:auto}.shell.expanded .nav button{width:100%}header{gap:10px}
@media(max-width:780px){.nav button{min-width:40px}.shell.expanded .nav button{width:40px}header>span{display:none}}
</style></head><body><div id="app"></div><dialog id="dialog"></dialog><div id="notice" role="status" aria-live="polite"></div>
<script>
/* business demo start */

/* Browser-only design fixture. No production API, payment or invoice integration. */
(() => {
 'use strict';
 const STORE='ting-business-demo-v1', NOW='2026-10-07T10:00:00+07:00';
 const people={ktv:{name:'Minh · KTV',role:'KTV'},owner:{name:'Lan · Chủ phòng',role:'Chủ phòng'},accountant:{name:'Hà · Kế toán',role:'Kế toán'},admin:{name:'An · Admin',role:'Admin'}};
 const seed=()=>({version:1,seq:20,settings:{price:500000,pack:10,company:'Công ty Phần mềm Mẫu',tax:'MST-DEMO',address:'Địa chỉ minh họa',bank:'Ngân hàng mẫu',account:'DEMO-000000',beneficiary:'CONG TY MAU',phone:'Số hỗ trợ mẫu',instructions:'Chuyển đúng số tiền và nội dung của đơn. Đây là dữ liệu demo, không chuyển tiền thật.'},profiles:{ktv:{name:'Minh',phone:'0900000001',email:'ktv@example.invalid',billing:''},owner:{name:'Lan',phone:'0900000002',email:'owner@example.invalid',billing:''}},rooms:[{id:'R01',name:'Cyber Bình Minh',owner:'ktv',type:'paid',until:'2027-10-01T00:00:00+07:00',seen:'07/10/2026 09:30',pcs:60},{id:'R02',name:'Phòng máy Lan',owner:'owner',type:'trial',until:'2026-11-16T00:00:00+07:00',seen:'07/10/2026 09:20',pcs:30},{id:'R03',name:'Cyber Sao Mai',owner:'ktv',type:'expired',until:'2026-10-01T00:00:00+07:00',seen:'06/10/2026 15:30',pcs:45}],keys:[{id:'K01',text:'DEMO1-AAAAA-BBBBB-CCCCC-DDDDD',owner:'ktv',state:'active',room:'R01',order:'DH001'},{id:'K02',text:'DEMO2-AAAAA-BBBBB-CCCCC-DDDDD',owner:'ktv',state:'unused',room:null,order:'DH001'},{id:'K03',text:'DEMO3-AAAAA-BBBBB-CCCCC-DDDDD',owner:'ktv',state:'active',room:'R03',order:'DH001'}],orders:[{id:'DH001',owner:'ktv',kind:'buy',quantity:3,total:1500000,state:'paid',invoice:'issued',company:'Công ty Phần mềm Mẫu',bank:'Ngân hàng mẫu',account:'DEMO-000000',beneficiary:'CONG TY MAU',price:500000,pack:10,terms:'demo-v1',created:NOW},{id:'DH002',owner:'owner',kind:'buy',quantity:1,total:500000,state:'waiting',invoice:'none',company:'Công ty Phần mềm Mẫu',bank:'Ngân hàng mẫu',account:'DEMO-000000',beneficiary:'CONG TY MAU',price:500000,pack:10,terms:'demo-v1',created:NOW}],bonuses:[{id:'UD01',owner:'ktv',room:'R01',days:15,evidence:'Ảnh hạn dùng phần mềm cũ · dữ liệu mẫu',state:'pending'}],refunds:[],accounts:[{id:'ktv',name:'Minh',role:'KTV',active:true},{id:'owner',name:'Lan',role:'Chủ phòng',active:true},{id:'accountant',name:'Hà',role:'Kế toán',active:true}],games:[{id:'G1',name:'Liên Minh Huyền Thoại',version:'26.19',hot:true,promoted:false},{id:'G2',name:'Valorant',version:'11.07',hot:false,promoted:true},{id:'G3',name:'Dota 2',version:'7.40',hot:false,promoted:false}],logs:[],update:{room:'R02',scenario:'trial',order:'DH002',online:true}});
 let db;try{db=JSON.parse(localStorage.getItem(STORE));}catch{} if(!db||db.version!==1)db=seed();

// Fill display metadata for earlier saved demo data without changing orders or keys.
const gameMeta={G1:{category:'online',size:'24.60 GB',updated:'06/10/2026 08:00',forceDownload:false},G2:{category:'online',size:'31.20 GB',updated:'05/10/2026 08:00',forceDownload:true},G3:{category:'online',size:'52.00 GB',updated:'04/10/2026 08:00',forceDownload:false}};
for(const g of db.games){for(const [k,v] of Object.entries(gameMeta[g.id]||{}))if(g[k]===undefined)g[k]=v;}
if(!db.games.some(g=>g.id==='G4'))db.games.push({id:'G4',name:'Black Myth: Wukong',version:'1.0',category:'offline',size:'118.20 GB',updated:'04/10/2026 08:00',hot:false,promoted:false,forceDownload:false});
if(!db.games.some(g=>g.id==='G5'))db.games.push({id:'G5',name:'7-Zip',version:'24.09',category:'tool',size:'0.01 GB',updated:'03/10/2026 08:00',hot:false,promoted:false,forceDownload:false});
delete db.menu;
 const params=new URLSearchParams(location.search),mode=params.get('mode')==='update'?'update':'console';
 let sidebarExpanded=false, gameFilter='all', statsMonth='2026-10';
 let actor=mode==='update'?'owner':sessionStorage.getItem('ting-demo-actor')||'admin',page='home',search='',viewState='ready';if(!people[actor])actor='ktv';
 const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ',date=s=>s?new Date(s).toLocaleDateString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'Chưa tính hạn';
 const staff=()=>['accountant','admin'].includes(actor),mine=x=>staff()||x.owner===actor;
 const save=()=>{localStorage.setItem(STORE,JSON.stringify(db));};
 const log=(action)=>{db.logs.unshift({at:NOW,actor:people[actor].name,action});save();};
 const id=p=>p+String(++db.seq).padStart(3,'0');
 const notice=t=>{$('#notice').textContent=t;$('#notice').style.display='block';clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('#notice').style.display='none',4000);};
 const names={waiting:'Chờ thanh toán',review:'Chờ xác nhận tiền',paid:'Đã thanh toán',cancelled:'Đã hủy',unused:'Chưa sử dụng',active:'Đang sử dụng',held:'Chờ hoàn key',revoked:'Đã thu hồi',pending:'Chờ duyệt',approved:'Đã duyệt',rejected:'Từ chối',refunding:'Chờ hoàn tiền',done:'Đã hoàn tiền',none:'Chưa phát hành',issued:'Đã phát hành',error:'Phát hành lỗi',adjusted:'Đã điều chỉnh',paidroom:'License 12 tháng',trial:'Dùng thử',expired:'Đã hết hạn'};
 const badge=s=>`<span class="badge ${['paid','active','approved','issued','done'].includes(s)?'ok':['rejected','revoked','expired','error'].includes(s)?'bad':'warn'}">${esc(names[s]||s)}</span>`;
 const btn=(text,action,key='',cls='')=>`<button class="${cls}" data-action="${action}" data-id="${esc(key)}">${text}</button>`;
 const gameToggle=(g,prop,label)=>'<label class="game-toggle"><input type="checkbox" aria-label="'+label+' · '+esc(g.name)+'" data-game="'+esc(g.id)+'" data-prop="'+prop+'" '+(g[prop]?'checked ':'')+(actor==='admin'?'':'disabled')+'><span>'+label+'</span></label>';
 const roomName=id=>db.rooms.find(r=>r.id===id)?.name||'Chưa gắn phòng';
 function table(headers,rows){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(c=>`<tr>${c.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Chưa có dữ liệu phù hợp.</div>';}
 const filtered=arr=>arr.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase()));
 function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
 function modal(title,content){const d=$('#dialog');d.innerHTML=`<button class="close" data-action="close" aria-label="Đóng">✕</button><h2>${title}</h2>${content}<p class="error" id="form-error" role="alert"></p>`;if(!d.open)d.showModal();}
 function form(kind,html,key=''){return `<form data-form="${kind}" data-id="${esc(key)}">${html}<p>${btn('Lưu / xác nhận','submit','','primary')}</p></form>`;}
 function fail(t){const e=$('#dialog').open?$('#dialog #form-error'):$('#form-error');if(e)e.textContent=t;else notice(t);}
 function close(){ $('#dialog').close(); }
 function addYear(s){const d=new Date(s),m=d.getUTCMonth();d.setUTCFullYear(d.getUTCFullYear()+1);if(d.getUTCMonth()!==m)d.setUTCDate(0);return d.toISOString();}
 function addDays(s,n){return new Date(Date.parse(s)+n*86400000).toISOString();}
 function navigation(){return actor==='owner'?[['home','Phòng máy của tôi'],['orders','Đơn hàng'],['invoices','Hóa đơn'],['bonuses','Ưu đãi chuyển đổi'],['support','Hỗ trợ'],['profile','Hồ sơ']]:actor==='ktv'?[['home','Tổng quan'],['rooms','Phòng máy'],['licenses','Bản quyền & Trial'],['keys','Key của tôi'],['buy','Mua key / pack'],['orders','Đơn hàng'],['bonuses','Ưu đãi chuyển đổi'],['invoices','Hóa đơn'],['refunds','Hoàn key'],['games','Danh mục Game'],['menu','Menu & Game quảng cáo'],['profile','Hồ sơ']]:[['home','Tổng quan'],['rooms','Phòng máy'],['licenses','Bản quyền & Trial'],['orders','Đơn hàng'],['keys','Quản lý key'],['bonuses','Duyệt ưu đãi'],['invoices','Hóa đơn'],['refunds','Hoàn key'],...(actor==='admin'?[['accounts','Tài khoản'],['games','Quản lý game'],['tracker','Tracker'],['menu','Menu & Game quảng cáo']]:[]),['settings','Cài đặt kinh doanh'],['history','Lịch sử']];}

 const trialCutoff='2026-11-16T00:00:00+07:00';
 const icons={"home":"M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z","rooms":"M3 4h18v13H3z M8 21h8 M12 17v4","licenses":"M14 4a5 5 0 1 0 0 10a5 5 0 1 0 0-10 M10 12l-7 7v2h3v-3h3v-3","games":"M6 8h12l3 9q0 3-3 2l-3-3H9l-3 3q-3 1-3-2z M7 10v4 M5 12h4 M16 11h1 M18 13h1","tracker":"M9 3h6v6H9z M3 16h6v5H3z M15 16h6v5h-6z M12 9v4 M6 16v-3h12v3","accounts":"M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M2 21v-3q0-5 7-5t7 5v3 M17 4q5 3 0 7 M18 14q4 1 4 7","settings":"M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2"};
 const navIcon=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="'+(icons[p]||icons[({keys:'licenses',buy:'licenses',orders:'licenses',bonuses:'licenses',invoices:'licenses',refunds:'licenses',profile:'accounts',menu:'games',history:'home',support:'settings'})[p]]||icons.settings)+'"/></svg>';
 const brand='<img src="../logo-admin.svg" alt="Ting Console" width="32" height="35"><span class="nav-label">Ting Console</span>';
 function licenseOverview(){return heading('Bản quyền & Trial','Trial dùng chung ngày kết thúc do server quy định. License mua và gia hạn đều 12 tháng.')+'<div class="card"><h2>Trial đến hết 15/11/2026</h2><p>Giờ Việt Nam · Mốc đọc từ cấu hình server, chỉ xem tại Console.</p><p class="muted">Không cấp trial theo phòng và không gia hạn trial. Ưu đãi chuyển đổi là nghiệp vụ riêng, chỉ áp dụng sau khi mua license.</p></div>'+roomsView();}
 function render(persist=true){if(persist)save();if(mode==='update'){renderUpdate();return;}const nav=navigation();if(!nav.some(n=>n[0]===page)&&page!=='auth')page='home';
 $('#app').innerHTML=`<div class="banner">DEMO · Dữ liệu mẫu ngày 07/10/2026 · Chưa kết nối dịch vụ thật</div><div class="shell ${sidebarExpanded?'expanded':''}"><aside><button class="brand-button" data-action="sidebar" title="Thu gọn / mở menu" aria-label="Thu gọn / mở menu">${brand}</button><div class="sub">${esc(people[actor].role)} · Không gian quản lý</div><nav class="nav">${nav.map(([p,t])=>`<button data-action="page" data-id="${p}" title="${t}" aria-label="${t}" class="${page===p?'active':''}">${navIcon(p)}<span class="nav-label">${t}</span></button>`).join('')}</nav><div class="sidebar-bottom"><button data-action="theme" title="Đổi sáng / tối" aria-label="Đổi sáng / tối">☼</button></div></aside><section><header><div class="header-brand"><img src="../logo-admin.svg" alt="" width="24" height="26"><strong>Ting Console</strong></div><span>${esc(people[actor].name)}</span><div class="tools"><label style="margin:0">Tài khoản mẫu <select id="actor">${Object.entries(people).map(([k,v])=>`<option value="${k}" ${k===actor?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label><select id="view-state" aria-label="Trạng thái màn hình">${[['ready','Có dữ liệu'],['empty','Rỗng'],['loading','Đang tải'],['error','Lỗi']].map(([k,v])=>`<option value="${k}" ${k===viewState?'selected':''}>${v}</option>`).join('')}</select>${btn('Đăng ký / đăng nhập','page','auth')}${btn('Reset mẫu','reset')}</div></header><main>${viewState==='loading'?'<div class="card">Đang tải dữ liệu mẫu…</div>':viewState==='error'?`<div class="card">Không thể tải dữ liệu. ${btn('Thử lại','retry')}</div>`:viewState==='empty'?'<div class="card empty">Chưa có dữ liệu. Chọn “Có dữ liệu” để tiếp tục thử.</div>':content()}</main></section></div>`;
 }
 function heading(t,sub=''){return `<h1>${t}</h1><p class="muted">${sub}</p>`;}
 function roomsView(){return table(['Phòng máy','Bản quyền','Hết hạn','Đồng bộ gần nhất','Thao tác'],filtered(db.rooms.filter(mine)).map(r=>[esc(r.name),badge(r.type==='paid'?'paidroom':r.type),r.type==='trial'?'15/11/2026 (hết ngày)':date(r.until),esc(r.seen),btn('Chi tiết','room',r.id)]));}
 function content(){switch(page){
 case 'home':return heading(actor==='owner'?'Phòng máy của tôi':'Tổng quan','Thông tin tại lần đồng bộ gần nhất; không khẳng định máy đang online.')+(actor==='owner'?roomsView()+btn('Mua 1 key','purchase','','primary'):`<div class="cards"><div class="card">Phòng quản lý<strong class="stat">${db.rooms.filter(mine).length}</strong>${btn('Xem phòng','page','rooms')}</div><div class="card">Đơn cần xử lý<strong class="stat">${db.orders.filter(mine).filter(o=>['waiting','review'].includes(o.state)).length}</strong>${btn('Xem đơn','page','orders')}</div><div class="card">Key chưa dùng<strong class="stat">${db.keys.filter(mine).filter(k=>k.state==='unused').length}</strong>${btn('Xem key','page','keys')}</div><div class="card">Ưu đãi chờ duyệt<strong class="stat">${db.bonuses.filter(mine).filter(b=>b.state==='pending').length}</strong>${btn('Xem ưu đãi','page','bonuses')}</div></div>${roomsView()}${['ktv','admin'].includes(actor)?sourceDashboard():''}`);
 case 'rooms':return heading('Phòng máy','Chỉ hiển thị phòng thuộc phạm vi tài khoản.')+searchBox()+roomsView();
 case 'keys':return heading(staff()?'Quản lý key':'Key của tôi','Key chưa dùng chưa bắt đầu tính 12 tháng. Một key cho một phòng.')+searchBox()+table(['Key','Trạng thái','Phòng / hạn','Đơn','Thao tác'],filtered(db.keys.filter(mine)).map(k=>[esc(k.text),badge(k.state),esc(roomName(k.room))+'<br>'+date(db.rooms.find(r=>r.id===k.room)?.until),esc(k.order),btn('Chi tiết','key',k.id)+(k.state==='unused'&&!staff()?btn('Đề nghị hoàn','refund-request',k.id):'')]));
 case 'buy':return heading('Mua key / pack','Thanh toán đủ một lần. Key được lưu ngay trong tài khoản sau khi xác nhận tiền.')+`<div class="cards"><div class="card"><h2>Mua lẻ</h2><div class="money">${money(db.settings.price)}</div><p>Mỗi key / 12 tháng</p>${btn('Mua key','purchase','','primary')}</div><div class="card"><h2>Pack ${db.settings.pack} key</h2><div class="money">${money(db.settings.price*db.settings.pack)}</div><p>Có thể đặt nhiều pack trong một đơn.</p>${btn('Mua pack','purchase','pack','primary')}</div></div>`;
 case 'orders':return heading('Đơn hàng','Báo đã chuyển khoản chưa phải xác nhận nhận tiền.')+searchBox()+(!staff()?btn('Mua key','purchase','','primary'):'')+table(['Mã đơn','Người mua','Loại / số key','Số tiền','Trạng thái',''],filtered(db.orders.filter(mine)).map(o=>[esc(o.id),esc(people[o.owner]?.name),o.kind==='renew'?'Gia hạn 12 tháng':`${o.quantity} key`,money(o.total),badge(o.state),btn('Xem đơn','order',o.id)]));
 case 'bonuses':return heading('Ưu đãi chuyển đổi','Mua license trước; kế toán duyệt số ngày còn lại từ phần mềm cũ, tối đa 30 ngày/phòng, một lần.')+(!staff()?btn('Gửi đề nghị','bonus-request','','primary'):'')+table(['Phòng','Số ngày','Bằng chứng','Trạng thái',''],filtered(db.bonuses.filter(mine)).map(b=>[esc(roomName(b.room)),String(b.days),esc(b.evidence),badge(b.state),staff()&&b.state==='pending'?btn('Xem / duyệt','bonus-review',b.id):esc(b.reason||'')]));
 case 'invoices':return heading('Hóa đơn','Mô phỏng quy trình với nhà cung cấp. Không tạo hóa đơn điện tử thật.')+table(['Đơn','Số tiền','Trạng thái hóa đơn',''],db.orders.filter(mine).filter(o=>o.state==='paid').map(o=>[esc(o.id),money(o.total),badge(o.invoice),btn('Thông tin','invoice',o.id)]));
 case 'refunds':return heading('Hoàn key','Chỉ đề nghị key chưa kích hoạt. Điều kiện thời hạn hoàn còn chờ chốt; demo minh họa xử lý hồ sơ.')+table(['Hồ sơ','Key','Số tiền','Trạng thái',''],db.refunds.filter(mine).map(r=>[esc(r.id),esc(r.key),money(r.amount),badge(r.state),btn('Xem hồ sơ','refund',r.id)]));
 case 'licenses':return licenseOverview();
 case 'settings':return settingsView();
 case 'profile':{let p=db.profiles[actor];return heading('Hồ sơ của tôi','Chỉ bổ sung thông tin khi cần mua hàng hoặc lập hóa đơn.')+`<div class="card form">${form('profile',field('Tên liên hệ','name',p.name,'text','required')+field('Số điện thoại','phone',p.phone,'tel','required')+field('Email','email',p.email,'email')+field('Thông tin xuất hóa đơn','billing',p.billing))}${btn('Đổi mật khẩu','password')}</div>`;}
 case 'accounts':return heading('Kỹ thuật viên & Khu vực','Tạo kỹ thuật viên, phân công khu vực và đặt lại mật khẩu.')+btn('Thêm KTV','account-add','','primary')+table(['Tài khoản (ID)','Họ và tên','Phân quyền','Khu vực quản lý','Trạng thái','Hành động'],db.accounts.map(a=>[esc(a.id),esc(a.name),esc(a.role),esc((a.regions||[]).join(', ')||'Chưa gán'),a.active?'Hoạt động':'Đã khóa',a.role==='KTV'?btn('Sửa khu vực','regions',a.id)+btn('Đặt mật khẩu','account-password',a.id):'Vai trò mới theo thiết kế']));
 case 'games':return heading('Quản lý Game & Menu','Quản lý game quảng cáo, HOT và tự động tải. Kỹ thuật viên chỉ xem.')+searchBox()+`<div class="row">${[['all','Tất cả'],['promoted','Quảng cáo'],['hot','HOT'],['online','Online'],['offline','Offline'],['tool','Tools']].map(([v,t])=>btn(t,'game-filter',v,gameFilter===v?'primary':'')).join('')}</div>`+table(['Game ID / Cập nhật','Tựa game','Phiên bản','Dung lượng','Thể loại','QC','HOT','Tự động tải',''],filtered(db.games).filter(g=>gameFilter==='all'||gameFilter==='promoted'&&g.promoted||gameFilter==='hot'&&g.hot||gameFilter===(g.category||'online')).map(g=>[esc(g.id)+'<br><span class="sub">'+esc(g.updated||'—')+'</span>',esc(g.name),esc(g.version),esc(g.size||'—'),esc(g.category||'online'),gameToggle(g,'promoted','QC'),gameToggle(g,'hot','HOT'),gameToggle(g,'forceDownload','Tự động tải'),actor==='admin'?btn('Chỉnh sửa','game',g.id):'Chỉ xem']));
 case 'tracker':return heading('Tracker & P2P (Mạng ngang hàng)','Peer tại lần tải gần nhất; chưa có dữ liệu ghép peer với phòng hoặc tên game.')+table(['Info Hash','Peer ID','IP Address','Port','Remaining (Left)','Last Announce'],[['a'.repeat(16)+'…','b'.repeat(16)+'…','203.0.113.10 (mẫu)','16882','128.00 MB','07/10/2026 09:30'],['c'.repeat(16)+'…','d'.repeat(16)+'…','198.51.100.20 (mẫu)','16882','0.00 MB','07/10/2026 09:29']]);
 case 'menu':return heading('Cài Đặt Ting Menu & Game Quảng Cáo','Game ghim quảng cáo, ảnh quảng cáo riêng và danh sách Game HOT.')+(actor==='ktv'?'<p class="help">KTV chỉ xem. Chỉ Admin được thay đổi.</p>':'')+searchBox()+table(['Game','Ghim quảng cáo','Game HOT','Ảnh quảng cáo riêng',''],filtered(db.games).map(g=>[esc(g.name),g.promoted?'Ghim đầu Poster Strip':'Không',g.hot?'Có':'Không',esc(g.adThumbnail||'Dùng thumbnail game'),actor==='admin'?btn('Cấu hình quảng cáo / HOT','game',g.id):'Chỉ xem']));
 case 'history':return heading('Lịch sử thao tác','Ai thay đổi, nội dung nào, vào thời điểm nào.')+table(['Thời điểm mẫu','Tài khoản','Thao tác'],db.logs.map(l=>[date(l.at),esc(l.actor),esc(l.action)]));
 case 'support':return heading('Hỗ trợ')+`<div class="card"><h2>${esc(db.settings.phone)}</h2><p>Chuẩn bị mã đơn và tên phòng để được hỗ trợ.</p>${btn('Xem đơn của tôi','page','orders')} <a href="../ting-update-demo/index.html?view=license&screen=3">Mở demo Ting Update</a></div>`;
 case 'auth':return authView();
 default:return '';}}

 function sourceDashboard(){return `<section class="card"><h2>Thống kê game theo tháng</h2><p class="muted">Lượt xem, mở game và lỗi trong tháng đã chọn.</p><label>Tháng thống kê<input type="month" id="stats-month" value="${statsMonth}"></label>${statsMonth==='2026-10'?table(['Game','Lượt xem','Mở thành công','Lỗi'],[['G1','120','110','2'],['G2','80','75','1']]):'<p>Chưa có thống kê trong tháng này.</p>'}<p>Dung lượng truyền game: chưa có dữ liệu tổng hợp.</p><p>Dung lượng lưu trữ: chưa có dữ liệu tổng hợp.</p></section>`;}
 function searchBox(){return `<div class="row"><input class="search" id="search" placeholder="Tìm theo tên hoặc mã…" value="${esc(search)}">${btn('Tìm','search')}${btn('Xóa lọc','clear-search')}</div>`;}
 function settingsView(){const s=db.settings;return heading('Cài đặt kinh doanh','Thiết kế lưu DB phía server; demo lưu trình duyệt. Đổi giá chỉ áp dụng cho đơn mới.')+`<div class="card form">${form('settings',(actor==='admin'?`<div class="fields">${field('Giá mua / gia hạn 12 tháng (VND)','price',s.price,'number','min="1" step="1" required')}${field('Số key mỗi pack','pack',s.pack,'number','min="1" max="1000" required')}</div>`:`<p>Giá mua / gia hạn: <b>${money(s.price)}</b>; ${s.pack} key/pack. Admin quản lý giá.</p>`)+field('Tên công ty bán hàng','company',s.company,'text','required')+field('Mã số thuế công ty','tax',s.tax,'text','required')+field('Địa chỉ','address',s.address,'text','required')+field('Ngân hàng','bank',s.bank,'text','required')+field('Số tài khoản minh họa','account',s.account,'text','required')+field('Chủ tài khoản','beneficiary',s.beneficiary,'text','required')+field('Kênh hỗ trợ','phone',s.phone)+field('Hướng dẫn thanh toán','instructions',s.instructions))}<div class="help">Trial chung: dùng hết 15/11/2026 (giờ Việt Nam). Đọc từ cấu hình server, không sửa tại đây. Không hiển thị secret ký license hoặc token nhà cung cấp.</div></div>`;}
 function authView(){return `<div class="auth card"><img src="../logo-admin.svg" alt="Ting Console" width="56" height="61"><h1>Chào mừng đến Ting</h1><p class="muted">Một tài khoản để quản lý phòng và giao dịch của bạn.</p>${form('register',`<label>Tôi là<select name="role"><option value="ktv">Kỹ thuật viên</option><option value="owner">Chủ phòng máy</option></select></label>`+field('Tên hiển thị','name','','text','required maxlength="80"')+field('Email','email','','email','required')+field('Mật khẩu','password','','password','required minlength="8"')+`<p class="sub">Không cần điền thông tin công ty lúc đăng ký. Mô phỏng xác minh email; không gửi email thật.</p>`)}${btn('Đăng nhập tài khoản mẫu','login')}${btn('Quên mật khẩu','forgot')}</div>`;}
 function purchase(kind='buy',target=''){if(kind==='renew'&&!db.rooms.some(r=>r.id===target&&mine(r)&&r.type!=='trial'&&db.keys.some(k=>k.room===r.id&&k.state==='active')))return notice('Phòng chưa có license đã mua. Hãy mua key để tiếp tục.');if(staff())return notice('Chọn tài khoản khách hàng để đặt mua.');const p=db.profiles[actor],r=db.rooms.find(r=>r.id===target);modal(kind==='renew'?'Gia hạn 12 tháng':'Đặt mua key',form('purchase',`<p>${kind==='renew'?esc(r?.name):'Key được quản lý trong ting-console sau khi xác nhận thanh toán.'}</p><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="room" value="${esc(target)}">`+(kind==='renew'?'':`<div class="fields"><label>Hình thức<select name="unit" id="purchase-unit"><option value="single">Key lẻ</option>${actor==='ktv'?`<option value="pack" ${target==='pack'?'selected':''}>Pack ${db.settings.pack} key</option>`:''}</select></label>${field('Số lượng','quantity',1,'number','min="1" max="1000" required id="purchase-quantity"')}</div>`)+`<p id="purchase-total" class="money">${money(db.settings.price*(target==='pack'?db.settings.pack:1))}</p>`+field('Tên liên hệ','name',p.name,'text','required')+field('Số điện thoại','phone',p.phone,'tel','required pattern="[+0-9 ()-]{9,16}"')+field('Thông tin hóa đơn (bổ sung khi cần)','billing',p.billing)+`<label><input type="checkbox" name="terms" required> Tôi đồng ý điều kiện mua: thanh toán đủ một lần; key tính 12 tháng từ kích hoạt. <span class="sub">Nội dung mẫu để xem luồng.</span></label>`));}
 function createOrder(owner,kind,quantity,room,billing){const s=db.settings;const o={id:id('DH'),owner,kind,quantity,room,total:quantity*s.price,state:'waiting',invoice:'none',price:s.price,pack:s.pack,company:s.company,tax:s.tax,address:s.address,bank:s.bank,account:s.account,beneficiary:s.beneficiary,instructions:s.instructions,billing,terms:'demo-v1',created:NOW};db.orders.unshift(o);log(`Tạo đơn ${o.id} · ${money(o.total)}`);return o;}
 function orderDetail(oid){const o=db.orders.find(o=>o.id===oid&&mine(o));if(!o)return notice('Không có quyền xem đơn.');modal('Đơn '+esc(o.id),`<div class="row spread">${badge(o.state)}<strong class="money">${money(o.total)}</strong></div><p>${o.kind==='renew'?'Gia hạn 12 tháng · '+esc(roomName(o.room)):o.quantity+' key / 12 tháng'}</p><div class="card"><b>${esc(o.company)}</b><p>${esc(o.bank)} · ${esc(o.account)}<br>${esc(o.beneficiary)}</p><p>Nội dung chuyển khoản: <b>${esc(o.id)}</b></p><p class="sub">${esc(o.instructions||'Dữ liệu mẫu, không chuyển tiền thật.')}</p></div><div class="timeline"><p>Tạo đơn · ${date(o.created)}</p><p>${o.state==='paid'?'Đã xác nhận đủ tiền':'Chờ kế toán đối chiếu tiền nhận'}</p><p>${o.state==='paid'?(o.kind==='renew'?'Đã cộng 12 tháng, giữ key cũ':'Key đã được cấp vào tài khoản'):'Chưa cấp key / chưa cộng hạn'}</p></div>${o.state==='paid'?db.keys.filter(k=>k.order===o.id).map(k=>`<p class="key">${esc(k.text)} ${btn('Sao chép','copy',k.id)}</p>`).join(''):''}<div class="row">${!staff()&&o.state==='waiting'?btn('Tôi đã chuyển khoản','report-paid',o.id,'primary')+btn('Hủy đơn','cancel-order',o.id):''}${staff()&&['waiting','review'].includes(o.state)?btn('Xác nhận đã nhận đủ tiền','confirm-paid',o.id,'primary'):''}${o.state==='paid'?btn('Xem hóa đơn','invoice',o.id):''}</div>`);}
 function pay(oid){const o=db.orders.find(o=>o.id===oid);if(!staff()||!o||!['waiting','review'].includes(o.state))return fail('Đơn không còn chờ xác nhận.');modal('Đối chiếu thanh toán',form('pay',`<p>Đơn <b>${esc(o.id)}</b> · phải nhận đủ <b>${money(o.total)}</b>. Chỉ xác nhận khi đã đối chiếu.</p>`+field('Số tiền thực nhận','amount','','number','required min="1" step="1"')+field('Mã giao dịch / ghi chú đối chiếu','reference','','text','required'),oid));}
 function finishPayment(o){if(o.state==='paid')return; if(o.kind==='renew'){const r=db.rooms.find(r=>r.id===o.room);if(!r||r.type==='trial'||!db.keys.some(k=>k.room===r.id&&k.state==='active'))return fail('Phòng chưa có license để gia hạn.');r.until=addYear(Date.parse(r.until)>Date.parse(NOW)?r.until:NOW);r.type='paid';}else{for(let n=0;n<o.quantity;n++){const kid=id('K');db.keys.push({id:kid,text:`DEMO0-${kid.padEnd(5,'X')}-AAAAA-BBBBB-CCCCC`,owner:o.owner,state:'unused',room:null,order:o.id});}}o.state='paid';log(`Xác nhận tiền ${o.id}; ${o.kind==='renew'?'gia hạn':'cấp '+o.quantity+' key'} một lần`);}
 function roomDetail(rid){const r=db.rooms.find(r=>r.id===rid&&mine(r));if(!r)return;modal(esc(r.name),`<p>${badge(r.type==='paid'?'paidroom':r.type)} · Hạn: ${r.type==='trial'?'Hết ngày 15/11/2026':date(r.until)}</p><p>${r.pcs} máy · Đồng bộ: ${esc(r.seen)}</p>${db.keys.filter(k=>k.room===r.id&&mine(k)).map(k=>`<p class="key">${esc(k.text)} ${btn('Sao chép','copy',k.id)}</p>`).join('')}<div class="row">${!staff()?(r.type==='trial'?btn('Mua 1 key','purchase'):btn('Gia hạn 12 tháng','renew',r.id,'primary'))+btn('Đề nghị ưu đãi','bonus-request',r.id):''}${actor==='admin'?btn('Chuyển người phụ trách','assign',r.id):''}</div>`);}
 function renderUpdate(){const u=db.update,r=db.rooms.find(r=>r.id===u.room);const paid=r.type==='paid';const expired=u.scenario==='expired'||u.scenario==='new'||u.scenario==='paid-expired';const offline=u.scenario==='offline';const o=db.orders.find(o=>o.id===u.order);$('#app').innerHTML=`<div class="banner">DEMO TING UPDATE · Luồng dự kiến, chưa nối server. Dùng cùng dữ liệu mẫu với Console.</div><div class="update"><header><div class="brand"><b>ting</b> update</div><select id="scenario" aria-label="Kịch bản bản quyền">${[['trial','Trial còn hạn'],['new','Mới cài, mua lần đầu'],['expired','Hết trial / chưa có key'],['offline','Mới cài, mất mạng'],['paid','License 12 tháng'],['paid-expired','License đã hết hạn']].map(([v,t])=>`<option value="${v}" ${u.scenario===v?'selected':''}>${t}</option>`).join('')}</select></header><div class="hero"><h1>${offline?'Cần kết nối Internet':paid&&!expired?'Đã kích hoạt Ting Update':expired?'Cần kích hoạt để tiếp tục':'Đã tự động bật dùng thử'}</h1><p>${offline?'Kết nối để server kiểm tra quyền dùng thử. Không cần mã KTV.':paid&&!expired?'License 12 tháng · Hạn '+date(r.until):expired?'Nhập key đã mua hoặc đặt mua ngay tại đây.':'Server mẫu xác nhận được dùng hết 15/11/2026, giờ Việt Nam.'}</p><span class="sub">Phòng: ${esc(r.name)} · Nhận diện máy tự động</span></div>${offline?btn('Mô phỏng kết nối lại','reconnect','','primary'):`<div class="cards"><div class="card"><h2>Tôi đã có key</h2><form data-form="activate"><label>Key text<input name="key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required></label><p>${btn('Kích hoạt','submit','','primary')}</p><p class="error" id="form-error"></p></form></div><div class="card"><h2>${paid||u.scenario==='paid-expired'?'Gia hạn cho phòng':'Mua 1 key'}</h2><div class="money">${money(db.settings.price)} <small>/ 12 tháng</small></div><p>Thanh toán đủ một lần, kế toán xác nhận. Không cần tạo hồ sơ riêng trước.</p>${btn(paid||u.scenario==='paid-expired'?'Gia hạn 12 tháng':'Đăng ký mua key',paid||u.scenario==='paid-expired'?'renew':'quick-buy',paid||u.scenario==='paid-expired'?r.id:'','primary')}</div></div>`}${o?`<div class="card"><div class="row spread"><h2>Đơn đang theo dõi · ${esc(o.id)}</h2>${badge(o.state)}</div><p>${money(o.total)} · ${esc(o.bank)} · ${esc(o.account)} · Nội dung: ${esc(o.id)}</p>${btn('Xem hướng dẫn / key','order',o.id)}${o.state==='paid'?db.keys.filter(k=>k.order===o.id).map(k=>`<p class="key">${esc(k.text)} ${btn('Điền key','fill-key',k.id)}</p>`).join(''):''}<p class="sub">Đóng/mở lại vẫn giữ đơn. Demo: mở Console cùng địa chỉ máy chủ, đổi sang Kế toán để duyệt.</p></div>`:''}<footer>${btn('Mở Console mẫu','open-console')} ${btn('Reset dữ liệu','reset')} ${!expired&&!offline?btn('Vào màn hình cập nhật game','enter-update','','primary'):''}<p>Không gửi dữ liệu, tiền hoặc tin nhắn thật. Không yêu cầu JSON.</p></footer></div>`;}
 function activate(text){const k=db.keys.find(k=>k.text===text.trim().toUpperCase()),r=db.rooms.find(r=>r.id===db.update.room);if(!k||k.owner!=='owner')return fail('Key không hợp lệ cho phòng mẫu này. Dùng key từ đơn đã được kế toán duyệt.');if(!['unused','active'].includes(k.state))return fail('Key đã bị thu hồi hoặc đang chờ hoàn.');if(k.room&&k.room!==r.id)return fail('Key đang dùng cho phòng khác. Vui lòng liên hệ hỗ trợ.');if(k.state==='unused'){if(r.type==='paid')return fail('Phòng đã có license. Hãy gia hạn key hiện tại.');k.state='active';k.room=r.id;r.until=addYear(NOW);r.type='paid';log(`Kích hoạt ${k.id} cho ${r.name}`);}db.update.scenario='paid';save();render();notice('Đã kích hoạt; nhập lại key không tính lại hạn.');}

 case 'invoice':{const o=db.orders.find(x=>x.id===k&&mine(x));if(!o)return;modal('Hóa đơn · '+esc(k),`<p>${badge(o.invoice)}</p><p>Bên bán: ${esc(o.company)} · ${esc(o.tax||'MST-DEMO')}</p><p>Thông tin người mua: ${esc(o.billing||'Chờ bổ sung thông tin cần thiết')}</p><p>Tổng đơn: ${money(o.total)}</p><p class="help">Chỉ là trạng thái mô phỏng, không phải hóa đơn hợp pháp. Bản thật lấy từ nhà cung cấp hóa đơn điện tử.</p>${staff()?btn('Mô phỏng phát hành thành công','invoice-issue',k)+btn('Mô phỏng lỗi nhà cung cấp','invoice-error',k):''}`);return;}
 case 'invoice-issue':case 'invoice-error':if(staff()){const o=db.orders.find(x=>x.id===k);if(o?.state==='paid'){o.invoice=a==='invoice-issue'?'issued':'error';log('Hóa đơn '+k+': '+o.invoice);render();action('invoice',k);}}return;
 case 'bonus-request':{const rooms=db.rooms.filter(r=>r.owner===actor);modal('Đề nghị ưu đãi chuyển đổi',form('bonus',`<label>Phòng máy<select name="room">${rooms.map(r=>`<option value="${r.id}" ${r.id===k?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>`+field('Số ngày còn lại (tối đa 30)','days',15,'number','min="1" max="30" required')+field('Mô tả / tham chiếu bằng chứng mẫu','evidence','','text','required')+'<p class="sub">Phải có license đã mua. Kế toán kiểm tra bằng chứng trước khi cộng ngày.</p>'));return;}
 case 'bonus-review':{if(!staff())return;const b=db.bonuses.find(x=>x.id===k);if(!b||b.state!=='pending')return;modal('Duyệt ưu đãi',form('bonus-review',`<p>${esc(roomName(b.room))} · ${esc(b.evidence)}</p><label>Kết quả<select name="decision"><option value="approved">Duyệt</option><option value="rejected">Từ chối</option></select></label>`+field('Số ngày được duyệt','days',b.days,'number','min="1" max="30" required')+field('Lý do / ghi chú','reason','','text','required'),k));return;}
 case 'refund-request':{const key=db.keys.find(x=>x.id===k&&x.owner===actor&&x.state==='unused');if(!key)return;modal('Đề nghị hoàn key',form('refund-request',`<p>Key ${esc(key.text)} chưa được kích hoạt. Demo chưa chốt điều kiện thời hạn hoàn.</p>`+field('Lý do','reason','','text','required'),k));return;}
 case 'refund':{const r=db.refunds.find(x=>x.id===k&&mine(x));if(!r)return;modal('Hồ sơ hoàn · '+esc(k),`<p>${badge(r.state)} · ${money(r.amount)}</p><p>${esc(r.reason)}</p>${staff()&&r.state==='pending'?btn('Duyệt và thu hồi key','refund-approve',k)+btn('Từ chối','refund-reject',k):''}${staff()&&r.state==='refunding'?btn('Ghi nhận đã hoàn tiền','refund-done',k):''}<p class="sub">Thu hồi key, chuyển tiền và điều chỉnh hóa đơn là các bước riêng.</p>`);return;}
 case 'refund-approve':case 'refund-reject':case 'refund-done':{if(!staff())return;const r=db.refunds.find(x=>x.id===k),key=db.keys.find(x=>x.id===r?.key);if(!r||!key)return;if(a==='refund-approve'&&r.state==='pending'&&key.state==='held'){r.state='refunding';key.state='revoked';}else if(a==='refund-reject'&&r.state==='pending'){r.state='rejected';key.state='unused';}else if(a==='refund-done'&&r.state==='refunding'){modal('Ghi nhận hoàn tiền',form('refund-done',field('Mã giao dịch hoàn tiền','reference','','text','required')+field('Tham chiếu điều chỉnh hóa đơn / lý do chưa phát hành','invoiceRef','','text','required'),k));return;}else return;log('Hoàn key '+k+': '+r.state);render();action('refund',k);return;}
 case 'account-toggle':{if(actor!=='admin')return;const acc=db.accounts.find(x=>x.id===k);acc.active=!acc.active;log('Tài khoản '+acc.name+': '+(acc.active?'mở':'khóa'));render();return;}
 case 'regions':{if(actor!=='admin')return;const acc=db.accounts.find(x=>x.id===k);modal('Khu vực '+esc(acc.name),form('regions',field('Khu vực (phân cách bằng dấu phẩy)','regions',(acc.regions||[]).join(', '),'text','required'),k));return;}
 case 'account-password':if(actor==='admin')modal('Đặt mật khẩu KTV',form('password',field('Mật khẩu mới mẫu (không lưu)','password','','password','required minlength="12"')+'<p>Source yêu cầu tối thiểu12 ký tự. Không nhập mật khẩu thật vào demo.</p>'));return;
 case 'account-add':if(actor==='admin')modal('Thêm KTV',form('account-add',field('Mã tài khoản','id','','text','required')+field('Tên hiển thị KTV','name','','text','required')+field('Khu vực (phân cách bằng dấu phẩy)','regions','','text','required')+field('Mật khẩu tạm mẫu (không lưu)','password','','password','required minlength="12"')));return;
 case 'game':{if(actor!=='admin')return;const g=db.games.find(x=>x.id===k);modal('Cấu hình '+esc(g.name),form('game',`<label><input type="checkbox" name="hot" ${g.hot?'checked':''}> Game HOT</label><label><input type="checkbox" name="promoted" ${g.promoted?'checked':''}> Game quảng cáo</label><label><input type="checkbox" name="forceDownload" ${g.forceDownload?'checked':''}> Tự động tải</label>${field('URL ảnh quảng cáo riêng','adThumbnail',g.adThumbnail||'','url')}<p class="sub">Để trống ảnh quảng cáo để dùng thumbnail game.</p>`,k));return;}
 case 'peer':modal('Peer quan sát',table(['Peer mẫu','Kênh','Thời điểm'],[['Peer A','Internet','09:30'],['Peer B','Internet','09:29']])+'<p>Không suy ra tài khoản hoặc chủ phòng từ endpoint peer.</p>');return;
 case 'assign':if(actor==='admin')modal('Chuyển người phụ trách',form('assign','<label>Tài khoản<select name="owner"><option value="ktv">Minh · KTV</option><option value="owner">Lan · Chủ phòng</option></select></label>'+field('Lý do','reason','','text','required'),k));return;
 case 'password':modal('Đổi mật khẩu',form('password',field('Mật khẩu hiện tại','old','','password','required')+field('Mật khẩu mới','password','','password','required minlength="8"')));return;
 case 'login':modal('Đăng nhập mẫu',form('login','<label>Tài khoản<select name="actor">'+Object.entries(people).map(([k,p])=>`<option value="${k}">${esc(p.name)}</option>`).join('')+'</select></label><p>Demo không xác thực mật khẩu thật.</p>'));return;
 case 'forgot':modal('Khôi phục tài khoản',form('forgot',field('Email','email','','email','required')+'<p>Thông báo chung, không tiết lộ email có tài khoản hay không.</p>'));return;
 case 'quick-buy':{const existing=db.orders.find(o=>o.id===db.update.order&&['waiting','review','paid'].includes(o.state));if(existing)return orderDetail(existing.id);modal('Mua 1 key ngay trên Ting Update',form('quick-buy',field('Tên liên hệ','name',db.profiles.owner.name,'text','required')+field('Số điện thoại','phone',db.profiles.owner.phone,'tel','required pattern="[+0-9 ()-]{9,16}"')+field('Tên phòng','room',roomName(db.update.room),'text','required')+`<p class="money">${money(db.settings.price)} / 12 tháng</p><label><input type="checkbox" required name="terms"> Đồng ý điều kiện mua mẫu</label><p class="sub">Hồ sơ được tạo cùng đơn. Xác minh liên hệ để thiết lập đăng nhập Console sau; không cần nhập mật khẩu ở đây.</p>`));return;}
 case 'fill-key':{close();const key=db.keys.find(x=>x.id===k&&x.owner==='owner');if(key)$('input[name=key]').value=key.text;return;}

 document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action!=='submit'){e.preventDefault();action(b.dataset.action,b.dataset.id);}});
 document.addEventListener('change',e=>{if(e.target.dataset?.game){if(actor!=='admin')return;const g=db.games.find(g=>g.id===e.target.dataset.game),prop=e.target.dataset.prop;if(g&&['promoted','hot','forceDownload'].includes(prop)){g[prop]=e.target.checked;log('Cấu hình game '+g.name);render();}return;}if(e.target.id==='stats-month'){statsMonth=e.target.value;render();}if(e.target.id==='actor'){actor=e.target.value;sessionStorage.setItem('ting-demo-actor',actor);page='home';search='';close();render();}if(e.target.id==='view-state'){viewState=e.target.value;render();}if(e.target.id==='scenario'){db.update.scenario=e.target.value;if(e.target.value==='new')db.update.order=null;if(e.target.value==='paid'||e.target.value==='paid-expired'){const r=db.rooms.find(r=>r.id===db.update.room);r.type=e.target.value==='paid'?'paid':'expired';r.until=e.target.value==='paid'?addYear(NOW):'2026-10-01T00:00:00+07:00';}else{const r=db.rooms.find(r=>r.id===db.update.room);r.type='trial';r.until='2026-11-16T00:00:00+07:00';}render();}});
 document.addEventListener('input',()=>{const total=$('#purchase-total');if(total&&$('#purchase-quantity')){const n=Number($('#purchase-quantity').value);total.textContent=money(db.settings.price*n*($('#purchase-unit').value==='pack'?db.settings.pack:1));}});
 document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const v=Object.fromEntries(new FormData(f)),k=f.dataset.id;switch(f.dataset.form){
 case 'activate':activate(v.key);return;
 case 'purchase':{if(staff())return fail('Chọn tài khoản khách hàng để mua.');if(v.kind==='renew'&&!db.rooms.some(r=>r.id===v.room&&mine(r)&&r.type!=='trial'&&db.keys.some(k=>k.room===r.id&&k.state==='active')))return fail('Trial không được gia hạn. Hãy mua license 12 tháng.');const q=v.kind==='renew'?1:Number(v.quantity)*(v.unit==='pack'?db.settings.pack:1);if(!Number.isSafeInteger(q)||q<1||q>100000)return fail('Số lượng không hợp lệ.');const p=db.profiles[actor];Object.assign(p,{name:v.name,phone:v.phone,billing:v.billing});const o=createOrder(actor,v.kind,q,v.room,v.billing);if(mode==='update')db.update.order=o.id;close();render();orderDetail(o.id);return;}
 case 'quick-buy':{const existing=db.orders.find(o=>o.id===db.update.order&&['waiting','review','paid'].includes(o.state));if(existing){orderDetail(existing.id);return;}Object.assign(db.profiles.owner,{name:v.name,phone:v.phone,verified:false});db.rooms.find(r=>r.id===db.update.room).name=v.room;const o=createOrder('owner','buy',1,db.update.room,'');db.update.order=o.id;close();render();orderDetail(o.id);return;}
 case 'pay':{const o=db.orders.find(o=>o.id===k);if(!staff()||!o||!['waiting','review'].includes(o.state))return fail('Đơn đã thay đổi, hãy tải lại.');if(Number(v.amount)!==o.total)return fail('Số tiền phải khớp toàn bộ giá trị đơn; chưa hỗ trợ trả nhiều lần.');o.reference=v.reference;finishPayment(o);close();render();orderDetail(k);return;}
 case 'settings':{if(!staff())return;const before=JSON.stringify(db.settings);if(actor==='admin'){if(!Number.isSafeInteger(+v.price)||+v.price<1||!Number.isSafeInteger(+v.pack)||+v.pack<1)return fail('Giá và số key phải là số nguyên dương.');db.settings.price=+v.price;db.settings.pack=+v.pack;}for(const x of ['company','tax','address','bank','account','beneficiary','phone','instructions'])db.settings[x]=v[x];log('Cài đặt: '+before+' → '+JSON.stringify(db.settings));break;}
 case 'profile':Object.assign(db.profiles[actor],v);log('Cập nhật hồ sơ của mình');break;

 case 'bonus-review':{if(!staff())return;const b=db.bonuses.find(x=>x.id===k),r=db.rooms.find(x=>x.id===b?.room);if(!b||b.state!=='pending')return fail('Hồ sơ đã xử lý.');if(v.decision==='approved'){if(r.type!=='paid'||!Number.isInteger(+v.days)||+v.days<1||+v.days>Math.min(30,b.days))return fail('Số ngày phải trong phạm vi bằng chứng, tối đa 30 và phòng đã mua license.');r.until=addDays(r.until,+v.days);b.days=+v.days;}b.state=v.decision;b.reason=v.reason;log('Ưu đãi '+k+': '+v.decision);break;}
 case 'refund-request':{const key=db.keys.find(x=>x.id===k&&x.owner===actor&&x.state==='unused');if(!key)return fail('Key không còn đủ điều kiện.');key.state='held';db.refunds.push({id:id('HT'),owner:actor,key:k,amount:db.orders.find(o=>o.id===key.order)?.price||db.settings.price,state:'pending',reason:v.reason});log('Đề nghị hoàn '+k);break;}
 case 'refund-done':{if(!staff())return;const r=db.refunds.find(x=>x.id===k);if(r?.state!=='refunding')return fail('Hồ sơ không chờ hoàn tiền.');r.state='done';r.reference=v.reference;r.invoiceRef=v.invoiceRef;log('Hoàn tiền '+k+' · '+v.reference+' · chứng từ '+v.invoiceRef);break;}
 case 'game':{if(actor!=='admin')return;const g=db.games.find(x=>x.id===k);g.hot=!!v.hot;g.promoted=!!v.promoted;g.forceDownload=!!v.forceDownload;g.adThumbnail=v.adThumbnail||'';log('Cấu hình game '+g.name);break;}
 case 'assign':{if(actor!=='admin')return;const r=db.rooms.find(x=>x.id===k);r.owner=v.owner;log('Chuyển phòng '+r.name+' · '+v.reason+'; không chuyển quyền sở hữu key/đơn cũ');break;}
 case 'regions':if(actor!=='admin')return;db.accounts.find(x=>x.id===k).regions=v.regions.split(',').map(x=>x.trim()).filter(Boolean);log('Sửa khu vực '+k);break;
 case 'account-add':if(actor!=='admin')return;if(db.accounts.some(x=>x.id===v.id))return fail('Mã tài khoản đã tồn tại.');db.accounts.push({id:v.id,name:v.name,regions:v.regions.split(',').map(x=>x.trim()).filter(Boolean),role:'KTV',active:true});log('Tạo KTV '+v.name);break;
 case 'register':actor=v.role;people[actor].name=v.name+' · '+people[actor].role;db.profiles[actor]={name:v.name,email:v.email,phone:'',billing:'',verified:false};sessionStorage.setItem('ting-demo-actor',actor);page='home';log('Đăng ký mẫu; chờ xác minh email');notice('Đã tạo hồ sơ mẫu. Xác minh liên hệ được mô phỏng, không gửi email thật.');break;
 case 'login':{if(db.accounts.find(a=>a.id===v.actor)?.active===false)return fail('Tài khoản mẫu đã bị khóa.');actor=v.actor;sessionStorage.setItem('ting-demo-actor',actor);page='home';break;}
 case 'forgot':close();notice('Nếu thông tin hợp lệ, hướng dẫn khôi phục sẽ được gửi. Demo không gửi email.');return;
 case 'password':close();notice('Đã mô phỏng đổi mật khẩu; không lưu mật khẩu trong demo.');return;
 }close();render();notice('Đã lưu dữ liệu mẫu.');});
