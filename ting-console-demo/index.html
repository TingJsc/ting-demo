function seedDemoAction(action, id) {

 if(action==='seed-up'||action==='seed-down') {
  const index=db.seedServers.findIndex(row=>row.id===id),other=index+(action==='seed-up'?-1:1);

  seedPending=true;seedNotice='Đã lưu thứ tự; CDN đang chờ cập nhật.';

 if(action==='seed-register-main'||action==='seed-register-secondary') {

  seedNotice='Đã nhận đăng ký theo TingID; không tạo thêm máy khi đăng ký lại.';
 }
 if(action==='seed-ip'||action==='seed-role') {
  const row=db.seedServers.find(row=>row.id==="TING-8A9B-4C2D-1E5F-8899");
  if(!row){seedNotice='Nhận đăng ký một Server trước khi thử tình huống này.';render();return;}

 }
 if(action==='seed-approve'||action==='seed-disable') {
  const row=db.seedServers.find(row=>row.id===id);if(!row)return;
  row.approval=action==='seed-approve'?'enabled':'disabled';seedPending=true;

 save();
 render();
}

 function licenseOverview(){

function poolsView(){

    const p=db.keyPools[actor]||{allocated:0,activated:0};
    const avail=Math.max(0,p.allocated-p.activated);
    const myRooms=db.rooms.filter(r=>r.tech===actor&&r.type==='paid');
    return heading('Kho Key Của Tôi (Lấy Hàng Trước — Chốt Cuối Tháng)',
      'Bạn được cấp trước kho key để chủ động cài đặt cho phòng máy. Cuối tháng kế toán chốt hóa đơn thanh toán theo số key thực tế đã kích hoạt.')

      +'<div class="card"><h2>Đã kích hoạt</h2><strong class="stat">'+p.activated+'</strong><p class="sub">Số phòng đã đưa vào sử dụng</p></div>'
      +'<div class="card"><h2>Tồn kho khả dụng</h2><strong class="stat">'+avail+'</strong><p class="sub">Key sẵn sàng để kích hoạt ngay</p></div>'
      +'</div>'
      +'<div class="card" style="margin:16px 0;">'
      +'<h3>Chính sách khoán & đối soát cuối tháng:</h3>'

      +'<p>• <b>Kích hoạt 1 năm</b>: Tính tròn 12 tháng (365 ngày) bắt đầu từ ngày kích hoạt thực tế cho từng phòng máy.</p>'

      +'<div class="row">'+btn('Kích hoạt phòng máy ngay','license-modal','','primary')+btn('Xem bảng kê chốt kỳ tháng này','page','settlements')+'</div>'
      +'</div>'
      +heading('Danh sách phòng máy đã kích hoạt từ kho key của bạn')
      +table(['Ting ID','Tên phòng máy','Ngày kích hoạt','Thời hạn 12 tháng','Tháng chốt kỳ'],
        myRooms.map(r=>[esc(r.ting),esc(r.name),date(r.activatedAt||r.until),date(r.until),'<span class="badge ok">'+esc(r.settlementMonth||'2026-10')+'</span>'])
      );
  }
  return '<div class="card">Màn hình dành riêng cho Kỹ thuật viên.</div>';

function settlementsView(){
  const currentMonth=statsMonth||'2026-10';
  const selectedTech=actor==='ktv'?actor:(sessionStorage.getItem('settlement-tech')||'ktv');
  const techObj=db.accounts.find(a=>a.id===selectedTech);
  const activatedRooms=db.rooms.filter(r=>r.tech===selectedTech&&r.type==='paid'&&(r.settlementMonth===currentMonth||r.activatedAt?.startsWith(currentMonth)));
  const count=activatedRooms.length;
  const totalAmount=count*db.settings.price;
  let settlementRec=db.settlements.find(s=>s.month===currentMonth&&s.tech===selectedTech);

  return heading('Chốt Kỳ Kế Toán & Đối Soát Cuối Tháng (Settlement)',
    'Tổng hợp số lượng key license KTV thực tế đã kích hoạt trong tháng để xuất 1 hóa đơn tổng thanh toán.')

    +'<label style="margin:0;width:auto;">Tháng đối soát: <input type="month" id="settlement-month" value="'+currentMonth+'" style="width:140px;"></label>'
    +(['admin','accountant'].includes(actor)?'<label style="margin:0;width:auto;">Kỹ thuật viên: <select id="settlement-tech" style="width:180px;">'+db.accounts.filter(a=>a.role==='KTV').map(a=>'<option value="'+a.id+'" '+(a.id===selectedTech?'selected':'')+'>'+esc(a.name)+' ('+a.id+')</option>').join('')+'</select></label>':'')

    +'<div class="cards">'
    +'<div class="card"><h2>Key kích hoạt trong kỳ</h2><strong class="stat">'+count+'</strong><p class="sub">Kỳ '+currentMonth+' · KTV '+esc(techObj?.name||selectedTech)+'</p></div>'
    +'<div class="card"><h2>Đơn giá khoán</h2><strong class="stat">'+money(db.settings.price)+'</strong><p class="sub">Giá cố định 1 key / 12 tháng</p></div>'

    +'<div class="card"><h2>Trạng thái kỳ chốt</h2><strong class="stat" style="font-size:16px;">'+badge(state)+'</strong><p class="sub">'+(settlementRec?.invoiceRef?('Số HĐ: '+esc(settlementRec.invoiceRef)):settlementRec?.paidRef?('Đã CK: '+esc(settlementRec.paidRef)):'Chưa xuất hóa đơn')+'</p></div>'
    +'</div>'
    +'<div class="row" style="margin:16px 0;">'
    +(finance()||actor==='admin'?(state==='pending_invoice'&&count>0?btn('Xuất 1 Hóa đơn tổng cho kỳ này','settlement-invoice-dialog',selectedTech,'primary'):state==='invoiced'?btn('Xác nhận đã nhận chuyển khoản ('+money(totalAmount)+')','settlement-pay-dialog',selectedTech,'primary'):state==='paid'?'<span class="badge ok">✓ Kỳ chốt '+currentMonth+' đã thanh toán hoàn tất (Số HĐ: '+esc(settlementRec?.invoiceRef||'—')+' · Mã UNC: '+esc(settlementRec?.paidRef||'—')+')</span>':''):actor==='ktv'?(state==='pending_invoice'?'<span class="badge warn">Kỳ chốt đang chờ kế toán xuất hóa đơn tổng cuối tháng.</span>':state==='invoiced'?'<span class="badge warn">Kế toán đã xuất hóa đơn <b>'+esc(settlementRec?.invoiceRef)+'</b>. Vui lòng chuyển khoản ngoài <b>'+money(totalAmount)+'</b>.</span>':state==='paid'?'<span class="badge ok">✓ Bạn đã hoàn tất thanh toán kỳ chốt này.</span>':''):'')

      activatedRooms.map((r,idx)=>[String(idx+1),'<code>'+esc(r.ting)+'</code>',esc(r.name),date(r.activatedAt||NOW),date(r.until),money(db.settings.price),esc(techObj?.name||selectedTech)])

    +heading('Lịch Sử Các Kỳ Đối Soát Đã Đóng')

 return `<div class="dn-toolbar">${btn('← Quay lại','p-note-back')}<b>${esc(n.no)}${n.status==='CANCELLED'?' · ĐÃ HỦY':''}</b>${btn('In phiếu','p-print','','primary')}</div><article class="dn-sheet"><img class="dn-watermark" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#059669"/><text x="50" y="66" font-size="52" font-family="Arial" font-weight="700" text-anchor="middle" fill="#fff">T</text></svg>')}">${n.status==='CANCELLED'?'<div class="dn-stamp">ĐÃ HỦY</div>':''}`
  +`<div class="dn-head"><div>Đơn vị: <b>${esc(c.name.toUpperCase())}</b><br>Địa chỉ: ${esc(c.address)}<br>Mã số thuế: ${esc(c.taxCode)}${c.phone?' · Điện thoại: '+esc(c.phone):''}</div><div class="dn-form"><b>Mẫu số 02 - VT</b><br>(Ban hành theo Thông tư số 200/2014/TT-BTC ngày 22/12/2014 của Bộ Tài chính)</div></div>`
  +`<h1 class="dn-title">PHIẾU XUẤT KHO</h1><p class="dn-c">Ngày ${d.getUTCDate()} tháng ${d.getUTCMonth()+1} năm ${d.getUTCFullYear()}<br>Số: ${esc(n.no)}</p><p>- Họ và tên người nhận hàng: <b>${esc(n.receiver)}</b><br>- Địa chỉ (bộ phận): ${esc(n.address)||'.........'}${n.taxCode?' · Mã số thuế: '+esc(n.taxCode):''}${n.phone?' · Điện thoại: '+esc(n.phone):''}<br>- Lý do xuất kho: ${esc(n.reason)}<br>- Xuất tại kho (ngăn lô): ${esc(n.warehouse)}</p>`
  +`<table class="dn-table"><thead><tr><th rowspan="2">STT</th><th rowspan="2">Tên, nhãn hiệu, quy cách, phẩm chất vật tư, dụng cụ, sản phẩm, hàng hóa</th><th rowspan="2">Mã số</th><th rowspan="2">Đơn vị tính</th><th colspan="2">Số lượng</th><th rowspan="2">Đơn giá</th><th rowspan="2">Thành tiền</th></tr><tr><th>Yêu cầu</th><th>Thực xuất</th></tr></thead><tbody><tr><td>1</td><td>Key bản quyền Ting Update (${n.months} tháng)</td><td>TUP-${n.months}M</td><td>Key</td><td class="dn-r">${n.quantity}</td><td class="dn-r">${n.quantity}</td><td class="dn-r">${num(n.unitPrice)}</td><td class="dn-r">${num(n.total)}</td></tr><tr><td colspan="7" class="dn-c"><b>Cộng</b></td><td class="dn-r"><b>${num(n.total)}</b></td></tr></tbody></table>`
  +`<p>- Tổng số tiền (viết bằng chữ): <b>${esc(K.vndInWords(n.total))}</b> (${money(n.total)}).<br>- Số chứng từ gốc kèm theo: ${esc(n.attachment)||'.........'}</p><div class="dn-sign"><div><b>Người lập phiếu</b><i>(Ký, họ tên)</i></div><div><b>Người nhận hàng</b><i>(Ký, họ tên)</i></div><div><b>Thủ kho</b><i>(Ký, họ tên)</i></div><div><b>Kế toán trưởng</b><i>(Ký, họ tên)</i><span>${esc(c.chiefAccountant||'')}</span></div><div><b>Giám đốc</b><i>(Ký, họ tên, đóng dấu)</i><span>${esc(c.director||'')}</span></div></div></article>`;}
// Kiểm tra tại chỗ như Console thật: báo lỗi khi rời ô và khi đang gõ; ô trống chưa chạm thì chưa báo; bấm gửi khi còn lỗi thì không gửi.
const touched=new WeakMap();
const ruled=(form,name)=>K.fieldsOf(form.dataset.pform).includes(name);
function showError(input,message){const holder=input.closest('label')||input.parentElement;let box=holder.querySelector('.field-error[data-for="'+input.name+'"]');if(!message){box?.remove();input.removeAttribute('aria-invalid');return;}if(!box){box=document.createElement('p');box.className='field-error';box.dataset.for=input.name;box.setAttribute('role','alert');holder.appendChild(box);}box.textContent=message;input.setAttribute('aria-invalid','true');}
function check(form,input,force){const set=touched.get(form)||new Set();touched.set(form,set);if(force)set.add(input.name);const values=Object.fromEntries(new FormData(form)),empty=!String(input.value).trim()&&!set.has(input.name);showError(input,empty?'':K.validate(form.dataset.pform,input.name,input.value,values));}
function formValid(form){let first=null;for(const input of form.elements||[])if(input.name&&ruled(form,input.name)){check(form,input,true);if(!first&&input.getAttribute('aria-invalid'))first=input;}first?.focus();return !first;}
function togglePassword(b){const input=b.previousElementSibling,visible=input.type==='password';input.type=visible?'text':'password';b.setAttribute('aria-pressed',String(visible));b.setAttribute('aria-label',(visible?'Ẩn ':'Hiện ')+b.dataset.label);}
function authFail(message){authError=message;const box=$('.portal-auth-error');if(box){box.textContent=message;box.hidden=false;}}
function enterPortal(user){portalId=user.id;actor=K.consoleActor(user);signedIn=true;sessionStorage.setItem('ting-demo-signed-out','0');sessionStorage.setItem('ting-demo-actor',actor);sessionStorage.setItem('ting-demo-portal-user',portalId);page='home';noteId='';ordersPage=1;notesPage=1;keyQuery='';keyUser='';keyPage=1;keyDetailPage=1;authError='';pError='';pNotice='';render();}
function portalRun(result){pError=result.ok?'':result.message;savePortal();render();return result;}
function portalGoogle(){if(signedIn||authPortal!=='user')return;const r=K.googleLogin(pdb,'1001','Google KTV');savePortal();return r.ok?enterPortal(r.user):authFail(r.message);}
function portalSubmit(f){if(!formValid(f))return;const v=Object.fromEntries(new FormData(f)),kind=f.dataset.pform;pNotice='';
 if(kind==='login'||kind==='register'){if(signedIn||(kind==='register'&&authPortal!=='user'))return;if(kind==='register'&&v.password!==v.confirm)return authFail('Mật khẩu nhập lại không khớp.');const id=String(v.id||'').trim(),r=kind==='login'?K.login(pdb,authPortal,id,v.password):K.register(pdb,id,v.name||'',v.password||'');savePortal();return r.ok?enterPortal(r.user):authFail(r.message);}
 const u=pu();if(!signedIn||!u)return;
 if(kind==='key-search'){keyQuery=String(v.q||'').trim().toLowerCase();keyUser='';keyPage=1;keyDetailPage=1;return render(false);}
 if(kind==='password'){const r=v.new_password!==v.confirm_password?{ok:false,message:'Mật khẩu nhập lại không khớp.'}:K.changePassword(pdb,u,v.current_password,v.new_password);if(!r.ok){const box=f.querySelector?.('[data-password-error]');if(box){box.hidden=false;box.textContent=r.message;return;}return portalRun(r);}f.reset?.();pNotice='Đã đổi mật khẩu.';return portalRun(r);}
 if(kind==='order')return portalRun(K.createOrder(pdb,u,Number(v.q),Number(v.months),v.note||''));
 if(kind==='profile'){const r=K.setProfile(pdb,u,{name:v.name,taxCode:v.tax,address:v.addr,phone:v.phone,contact:v.contact});if(r.ok)pNotice='Đã lưu hồ sơ người mua.';return portalRun(r);}
 if(kind==='company')return portalRun(K.setCompany(pdb,u,{name:v.name,taxCode:(v.tax||'').trim(),address:v.addr,phone:(v.phone||'').trim(),warehouse:(v.wh||'').trim(),director:(v.dir||'').trim(),chiefAccountant:(v.chief||'').trim()}));
 if(kind==='price')return portalRun(K.setPrice(pdb,u,Number(v.p1),Number(v.p12)));
 if(kind==='admin')return portalRun(K.createAdmin(pdb,u,String(v.id||'').trim(),v.name||'',v.pw||'',v.role));}
function portalAction(a,k){const u=pu();if(!signedIn||!u)return;pNotice='';
 if(a==='p-order-ok'||a==='p-order-no')return portalRun(K.decideOrder(pdb,u,k,a==='p-order-ok'?'approve':'reject'));
 if(a==='p-activate')return portalRun(K.activateKey(pdb,k));
 if(a==='p-note-new'){const r=K.createNote(pdb,u,k);if(r.ok)noteId=r.note.id;return portalRun(r);}
 if(a==='p-note-open'||a==='p-note-back'){noteId=a==='p-note-open'?k:'';return render(false);}
 if(a==='p-note-cancel'){const reason=window.prompt?.('Lý do hủy phiếu:');return reason?portalRun(K.cancelNote(pdb,u,k,reason)):undefined;}
 if(a==='p-print')return window.print?.();
 if(a==='p-order-page'){ordersPage=Number(k)||1;return render(false);}
 if(a==='p-note-page'){notesPage=Number(k)||1;return render(false);}
 if(a==='p-key-page'){keyPage=Number(k)||1;keyUser='';keyDetailPage=1;return render(false);}
 if(a==='p-key-user'||a==='p-key-close'){keyUser=a==='p-key-user'?k:'';keyDetailPage=1;return render(false);}
 if(a==='p-key-detail-page'){keyDetailPage=Number(k)||1;return render(false);}
 if(a==='p-admin-lock')return portalRun(K.setAdminActive(pdb,u,k,pdb.users[k]?.active===false));
 if(a==='p-admin-pw'){const r=K.setAdminPassword(pdb,u,k,$(`[data-pw="${k}"]`)?.value||'');if(r.ok)pNotice='Đã đổi mật khẩu.';return portalRun(r);}
 if(a==='p-refund'){const picked=pdb.keys.filter(x=>x.user===u.id&&x.pick),orders=new Set(picked.map(x=>x.order));if(orders.size!==1)return portalRun({ok:false,message:'Chỉ chọn key thuộc cùng một đơn để đề nghị hoàn.'});const r=K.requestRefund(pdb,u,[...orders][0],picked.map(x=>x.id));picked.forEach(x=>{x.pick=false;});return portalRun(r);}
 if(a==='p-refund-ok'||a==='p-refund-no'){const r=K.decideRefund(pdb,u,k,a==='p-refund-ok'?'approve':'reject');pNotice=K.refundNotice(r);return portalRun(r);}}
function portalChange(el){const u=pu();if(!u)return;if(el.dataset.pchange==='pick'){const key=pdb.keys.find(x=>x.id===el.dataset.id&&x.user===u.id);if(key){key.pick=el.checked;savePortal();render(false);}return;}if(el.dataset.pchange==='assign'&&el.value)portalRun(K.assignKey(pdb,u,el.dataset.id,el.value));}

 return heading(actor==='owner'?'Phòng máy của tôi':'Tổng quan','Thông tin tại lần đồng bộ gần nhất; không khẳng định máy đang online.')+(actor==='owner'?roomsView()+btn('Mua 1 key','purchase','','primary'):`<div class="cards"><div class="card">Phòng quản lý<strong class="stat">${db.rooms.filter(roomMine).length}</strong>${btn('Xem phòng','page','rooms')}</div><div class="card">Đơn cần xử lý<strong class="stat">${db.orders.filter(mine).filter(o=>['waiting','review'].includes(o.state)).length}</strong>${btn('Xem đơn','page','orders')}</div><div class="card">Key chưa dùng<strong class="stat">${db.keys.filter(mine).filter(k=>k.state==='unused').length}</strong>${btn('Xem key','page','keys')}</div><div class="card">Ưu đãi chờ duyệt<strong class="stat">${db.bonuses.filter(mine).filter(b=>b.state==='pending').length}</strong>${btn('Xem ưu đãi','page','bonuses')}</div></div>${roomsView()}${['ktv','admin'].includes(actor)?sourceDashboard():''}`);
 case 'rooms':return heading('Phòng máy','Gán Ting ID, theo dõi bản quyền và người phụ trách.')+(actor==='ktv'?btn('Gán phòng máy','room-add','','primary'):'')+searchBox()+roomsView();
 case 'keys':return heading(!customer()?'Quản lý key':'Key của tôi','Key chưa dùng chưa bắt đầu tính thời hạn. Một key cho một phòng.')+searchBox()+table(['Key / thời hạn','Trạng thái','Phòng / hạn','Đơn','Thao tác'],filtered(db.keys.filter(mine)).map(k=>[esc(k.text)+'<br><span class="sub">'+(k.months||12)+' tháng</span>',badge(k.state),esc(roomName(k.room))+'<br>'+date(db.rooms.find(r=>r.id===k.room)?.until),esc(k.order),btn('Chi tiết','key',k.id)+(k.state==='unused'&&customer()?btn('Đề nghị hoàn','refund-request',k.id):'')]));
 case 'buy':return heading('Mua key / pack','Thanh toán đủ một lần. Key được lưu ngay trong tài khoản sau khi xác nhận tiền.')+`<div class="cards"><div class="card"><h2>Key 1 tháng</h2><div class="money">${money(db.settings.oneMonthPrice)}</div><p>Mỗi key / 1 tháng</p>${btn('Mua key','purchase','','primary')}</div><div class="card"><h2>Key 12 tháng</h2><div class="money">${money(db.settings.price)}</div><p>Mỗi key / 12 tháng; có thể chọn pack ${db.settings.pack} key trong đơn.</p>${btn('Mua key / pack','purchase','pack','primary')}</div></div>`;
 case 'orders':return heading('Đơn hàng','Báo đã chuyển khoản chưa phải xác nhận nhận tiền.')+searchBox()+(customer()?btn('Mua key','purchase','','primary'):'')+table(['Mã đơn','Người mua','Loại / số key','Số tiền','Trạng thái',''],filtered(db.orders.filter(mine)).map(o=>[esc(o.id),esc(o.contactName||people[o.owner]?.name),o.kind==='renew'?'Gia hạn 12 tháng':`${o.quantity} key / ${o.months||12} tháng`,money(o.total),badge(o.state),btn('Xem đơn','order',o.id)]));
  case 'bonuses':return heading('Ưu đãi chuyển đổi','Mua license trước; kế toán duyệt số ngày còn lại từ phần mềm cũ, tối đa 30 ngày/phòng, một lần.')+(customer()?btn('Gửi đề nghị','bonus-request','','primary'):'')+table(['Phòng','Số ngày','License cũ / bằng chứng','Trạng thái',''],filtered(db.bonuses.filter(mine)).map(b=>[esc(roomName(b.room)),String(b.days),esc(b.software?b.software+' · hết '+b.oldLicenseUntil+' · '+b.evidence:b.evidence),badge(b.state),finance()&&b.state==='pending'?btn('Xem / duyệt','bonus-review',b.id):esc(b.reason||'')]));
 case 'invoices':return heading('Hóa đơn','Mô phỏng quy trình với nhà cung cấp. Không tạo hóa đơn điện tử thật.')+table(['Đơn','Số tiền','Trạng thái hóa đơn',''],db.orders.filter(mine).filter(o=>o.state==='paid').map(o=>[esc(o.id),money(o.total),badge(o.invoice),btn('Thông tin','invoice',o.id)]));
 case 'refunds':return (customer()?'<div class="card"><h2>Key chưa dùng có thể đề nghị hoàn</h2>'+db.keys.filter(k=>k.owner===actor&&k.state==='unused').map(k=>'<p>'+esc(k.text)+' '+btn('Đề nghị hoàn','refund-request',k.id)+'</p>').join('')+'</div>':'')+heading('Hoàn key','Chỉ đề nghị key chưa kích hoạt. Điều kiện thời hạn hoàn còn chờ chốt; demo minh họa xử lý hồ sơ.')+table(['Hồ sơ','Key','Số tiền','Trạng thái',''],db.refunds.filter(mine).map(r=>[esc(r.id),esc(r.key),money(r.amount),badge(r.state),btn('Xem hồ sơ','refund',r.id)]));
 case 'licenses':return licenseOverview();
case 'pools':return poolsView();
case 'settlements':return settlementsView();
 case 'settings':return actor==='admin'?updatePolicyView()+menuView()+settingsView():actor==='operator'?updatePolicyView()+menuView():actor==='ktv'?menuView():settingsView();
 case 'profile':{let p=db.profiles[actor];return heading('Hồ sơ của tôi',actor==='owner'?'Thông tin liên hệ để hỗ trợ phòng và đơn tự mua.':'Bổ sung thông tin khi cần mua hàng hoặc lập hóa đơn.')+`<div class="card form">${form('profile',field('Tên liên hệ','name',p.name,'text','required')+field('Số điện thoại','phone',p.phone,'tel','required')+field('Email','email',p.email,'email')+(actor==='ktv'?field('Thông tin xuất hóa đơn','billing',p.billing):''))}${pu()?btn('Đổi mật khẩu','page','user-settings'):btn('Đổi mật khẩu','password')}</div>`;}
 case 'accounts':return heading('Kỹ thuật viên & Khu vực','Tạo kỹ thuật viên, phân công khu vực và đặt lại mật khẩu. Mật khẩu cần ít nhất 12 ký tự; khu vực quyết định phạm vi phòng.')+btn('Thêm KTV','account-add','','primary')+table(['Tài khoản (ID)','Họ và tên','Phân quyền','Khu vực quản lý','Trạng thái','Hành động'],db.accounts.filter(a=>a.role==='KTV').map(a=>[esc(a.id),esc(a.name),esc(a.role),esc((a.regions||[]).join(', ')||'Chưa gán'),a.active?'Hoạt động':'Đã khóa',a.role==='KTV'?btn('Sửa khu vực','regions',a.id)+btn('Đặt mật khẩu','account-password',a.id):'Vai trò mới theo thiết kế']));

chứng từ license cũ<input type="file" name="oldLicenseProof" accept="image/jpeg,image/png,image/webp,application/pdf"></label>'+'<p class="sub">Kế toán chỉ xét tối đa 30 ngày sau khi đơn đã thanh toán đủ.</p></details>':'')+`<label><input type="checkbox" name="terms" required> Tôi đồng ý điều kiện mua: thanh toán đủ một lần; key tính theo thời hạn đã chọn từ lúc kích hoạt. <span class="sub">Nội dung mẫu để xem luồng.</span></label>`));}

 function pay(oid){const o=db.orders.find(o=>o.id===oid);if(!finance()||!o||!['waiting','review'].includes(o.state))return fail('Đơn không còn chờ xác nhận.');modal('Đối chiếu thanh toán',form('pay',`<p>Đơn <b>${esc(o.id)}</b> · phải nhận đủ <b>${money(o.total)}</b>. Chỉ xác nhận khi đã đối chiếu.</p>`+field('Số tiền thực nhận','amount','','number','required min="1" step="1"')+field('Mã giao dịch / ghi chú đối chiếu','reference','','text','required'),oid));}
  function finishPayment(o){if(!finance()||!['waiting','review'].includes(o.state))return false; if(o.kind==='renew'){const r=db.rooms.find(r=>r.id===o.room);if(!r||r.revoked||r.type==='trial'||!db.keys.some(k=>k.room===r.id&&k.state==='active'))return fail('Phòng chưa có license để gia hạn.');r.until=addYear(Date.parse(r.until)>Date.parse(NOW)?r.until:NOW);r.type='paid';}else{for(let n=0;n<o.quantity;n++){const kid=id('K');db.keys.push({id:kid,text:`DEMO0-${kid.padEnd(5,'X')}-AAAAA-BBBBB-CCCCC`,owner:o.owner,state:'unused',room:null,order:o.id,months:o.months||12});}}o.state='paid';if(o.kind==='buy'&&o.oldOffer&&!db.bonuses.some(b=>b.room===o.room&&['pending','approved'].includes(b.state))){const days=Math.min(30,Math.ceil((Date.parse(o.oldOffer.until+'T23:59:59+07:00')-Date.parse(NOW))/86400000));if(days>0)db.bonuses.push({id:id('UD'),owner:o.owner,room:o.room,order:o.id,software:o.oldOffer.software,oldLicenseUntil:o.oldOffer.until,evidence:o.oldOffer.evidence,days,state:'pending',applied:false});}log(`Xác nhận tiền ${o.id}; ${o.kind==='renew'?'gia hạn':'cấp '+o.quantity+' key'} một lần`);return true;}

 function roomDetail(rid){const r=db.rooms.find(r=>r.id===rid&&roomMine(r));if(!r)return;modal(esc(r.name),`<p>${badge(paidActive(r)?'paidroom':trialActive(r)?'trial':'expired')} · Hạn: ${date(r.until)+' · Còn '+Math.max(0,Math.ceil((Date.parse(r.until)-Date.parse(NOW))/86400000))+' ngày'}</p><p>${r.pcs} máy · Đồng bộ: ${esc(r.seen)}</p>${db.keys.filter(k=>k.room===r.id&&mine(k)).map(k=>`<p class="key">${esc(k.text)} ${btn('Sao chép','copy',k.id)}</p>`).join('')}<div class="row">${customer()&&!r.revoked?(r.type==='trial'?btn('Mua 1 key','purchase'):btn('Gia hạn 12 tháng','renew',r.id,'primary'))+btn('Đề nghị ưu đãi','bonus-request',r.id):''}</div>`);}
 function renderUpdate(){const u=db.update,r=db.rooms.find(r=>r.id===u.room);const paid=paidActive(r);const trial=trialActive(r);const expired=u.scenario==='expired'||u.scenario==='paid-expired'||(!paid&&!trial);const offline=u.scenario==='offline';const o=db.orders.find(o=>o.id===u.order);$('#app').innerHTML=`<div class="banner">DEMO TING UPDATE · Luồng dự kiến, chưa nối server. Dùng cùng dữ liệu mẫu với Console.</div><div class="update"><header><div class="brand"><b>ting</b> update</div><select id="scenario" aria-label="Kịch bản bản quyền">${[['trial','Trial còn hạn'],['new','Mới cài (tự dùng thử)'],['expired','Hết trial / chưa có key'],['offline','Mới cài, mất mạng'],['paid','License 12 tháng'],['paid-expired','License đã hết hạn']].map(([v,t])=>`<option value="${v}" ${u.scenario===v?'selected':''}>${t}</option>`).join('')}</select></header><div class="hero"><h1>${offline?'Cần kết nối Internet':paid&&!expired?'Đã kích hoạt Ting Update':expired?'Cần kích hoạt để tiếp tục':'Đã tự động bật dùng thử'}</h1><p>${offline?'Kết nối để server kiểm tra quyền dùng thử. Không cần mã KTV.':paid&&!expired?'License 12 tháng · Hạn '+date(r.until):expired?'Nhập key đã mua hoặc đặt mua ngay tại đây.':'Dùng thử 30 ngày từ lần kích hoạt đầu. Không cần mã KTV.'}</p><span class="sub">Phòng: ${esc(r.name)} · Nhận diện máy tự động</span></div>${offline?btn('Mô phỏng kết nối lại','reconnect','','primary'):`<div class="cards"><div class="card"><h2>Tôi đã có key</h2><form data-form="activate"><label>Key text<input name="key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required></label><p>${btn('Kích hoạt','submit','','primary')}</p><p class="error" id="form-error"></p></form></div><div class="card"><h2>${paid||u.scenario==='paid-expired'?'Gia hạn cho phòng':'Mua 1 key'}</h2><div class="money">${money(db.settings.price)} <small>/ 12 tháng</small></div><p>Thanh toán đủ một lần, kế toán xác nhận. Không cần đăng ký Console để mua.</p>${r.owner==='owner'?btn(paid||u.scenario==='paid-expired'?'Đặt gia hạn':'Đặt mua 1 key',paid||u.scenario==='paid-expired'?'renew':'quick-buy',paid||u.scenario==='paid-expired'?r.id:'','primary'):'<p class="sub">Phòng này do KTV quản lý; liên hệ KTV để mua/gia hạn.</p>'}</div></div>`}${o?`<div class="card"><div class="row spread"><h2>Đơn đang theo dõi · ${esc(o.id)}</h2>${badge(o.state)}</div><p>${money(o.total)} · ${esc(o.bank)} · ${esc(o.account)} · Nội dung: ${esc(o.id)}</p>${btn('Xem hướng dẫn / key','order',o.id)}${o.state==='paid'?db.keys.filter(k=>k.order===o.id).map(k=>`<p class="key">${esc(k.text)} ${btn('Điền key','fill-key',k.id)}</p>`).join(''):''}<p class="sub">Đóng/mở lại vẫn giữ đơn. Demo: mở Console cùng địa chỉ máy chủ, đổi sang Kế toán để duyệt.</p></div>`:''}<footer>${btn('Mở Console mẫu','open-console')} ${btn('Reset dữ liệu','reset')} ${!expired&&!offline&&(paid||trial)?btn('Vào màn hình cập nhật game','enter-update','','primary'):''}<p>Không gửi dữ liệu, tiền hoặc tin nhắn thật. Chỉ nhập key để kích hoạt.</p></footer></div>`;}
  function activate(text){if(actor!=='owner'||mode!=='update')return;const k=db.keys.find(k=>k.text===text.trim().toUpperCase()),r=db.rooms.find(r=>r.id===db.update.room);if(!r||r.revoked)return fail('Phòng không còn được phép kích hoạt.');if(k?.order==='TECHNICAL'){if(k.boundRoom!==r.id||!['unused','active'].includes(k.state))return fail('Key không hợp lệ cho phòng này.');if(k.state==='unused'){r.until=addMonths(r.type==='paid'&&new Date(r.until)>new Date(NOW)?r.until:NOW,k.months||12);r.type='paid';k.state='active';k.room=r.id;}db.update.scenario='paid';save();render();notice('Đã kích hoạt key '+(k.months||12)+' tháng.');return;}if(!k||!(k.owner==='owner'||(k.owner==='guest'&&k.order===db.update.order))||db.orders.find(o=>o.id===k.order)?.state!=='paid')return fail('Key không hợp lệ cho phòng mẫu này. Dùng key từ đơn đã được kế toán duyệt.');if(!['unused','active'].includes(k.state))return fail('Key đã bị thu hồi hoặc đang chờ hoàn.');if(k.room&&k.room!==r.id)return fail('Key đang dùng cho phòng khác. Vui lòng liên hệ hỗ trợ.');if(k.state==='unused'){if(r.type==='paid')return fail('Phòng đã có license. Hãy gia hạn key hiện tại.');k.state='active';k.room=r.id;r.until=addMonths(NOW,k.months||12);r.type='paid';const bonus=db.bonuses.find(b=>b.order===k.order&&b.room===r.id&&b.state==='approved'&&!b.applied);if(bonus){r.until=addDays(r.until,bonus.days);bonus.applied=true;}log(`Kích hoạt ${k.id} cho ${r.name}`);}db.update.scenario='paid';save();render();notice('Đã kích hoạt; nhập lại key không tính lại hạn.');}

 case 'bonus':{if(!customer())return;const r=db.rooms.find(r=>r.id===v.room&&r.owner===actor);if(!r||r.revoked||r.type!=='paid')return fail('Phòng cần có license đã mua trước khi duyệt ưu đãi.');if(db.bonuses.some(b=>b.room===r.id&&['pending','approved'].includes(b.state)))return fail('Phòng đã có đề nghị đang chờ hoặc đã nhận ưu đãi.');const evidence=selectedProof(v.evidence);if(!evidence)return fail('Chọn ảnh JPG, PNG, WebP hoặc PDF không quá 10 MB.');db.bonuses.push({id:id('UD'),owner:actor,room:r.id,days:+v.days,evidence,state:'pending'});log('Gửi ưu đãi cho '+r.name);break;}

 case 'menu-select':{if(!technical()||!['promoted','hot'].includes(k))return;const g=db.games.find(g=>g.id===v.game);if(!g)return fail('Chọn game trong danh sách.');g[k]=true;log('Thêm game '+g.name+' vào '+(k==='hot'?'HOT':'QC'));break;}
 case 'game':{if(!technical())return;const g=db.games.find(x=>x.id===k);if(!g)return;const image=String(v.adThumbnail||'').trim();if(image&&!/^https?:\/\//i.test(image))return fail('Ảnh quảng cáo cần URL http hoặc https.');g.hot=!!v.hot;g.promoted=!!v.promoted;g.forceDownload=!!v.forceDownload;g.adThumbnail=image;log('Cấu hình game '+g.name);queueMicrotask(()=>notice(new URLSearchParams(location.search).get('cdn')==='pending'?'Đã lưu, CDN chưa cập nhật. Hệ thống sẽ tự thử lại.':'Đã lưu và cập nhật CDN. Máy phòng nhận thay đổi trong lượt đồng bộ tiếp theo.'));break;}
case 'settlement-invoice':{
  if(!finance()&&actor!=='admin')return;

  const month=statsMonth||'2026-10';
  if(!v.invoiceRef?.trim())return fail('Điền số hóa đơn VAT hợp lệ.');

 case 'room-add':{if(actor!=='ktv')return;const ting=String(v.ting||'').trim().toUpperCase(),region=String(v.region||'').trim(),tech=db.accounts.find(a=>a.id===actor&&a.role==='KTV'&&a.active);
 if(!/^TING-[A-Z0-9]{4}(-[A-Z0-9]{4}){3}$/.test(ting)||!v.name?.trim())return fail('Điền Ting ID và tên phòng hợp lệ.');
